function compile(t){t=t.toLowerCase().replace(/[，。！？、·,.!?\s:_-]/g,'');if((t.includes('火焰')||t.includes('烈火')||t.includes('fire'))&&(t.includes('枪')||t.includes('穿刺')))return'fire';if((t.includes('寒霜')||t.includes('冰霜')||t.includes('frost'))&&(t.includes('盾')||t.includes('护壁')))return'frost';if((t.includes('雷霆')||t.includes('闪电')||t.includes('thunder'))&&(t.includes('链')||t.includes('追踪')))return'thunder';if((t.includes('疾风')||t.includes('wind'))&&(t.includes('步')||t.includes('前行')))return'wind';if((t.includes('辉光')||t.includes('治愈')||t.includes('生命'))&&(t.includes('复苏')||t.includes('恢复')||t.includes('治愈')))return'heal';return null}

const voiceBox=document.getElementById('voiceBox');function openVoice(){voiceBox.style.display='block';document.getElementById('voiceInput').focus()}function closeVoice(){voiceBox.style.display='none';canvas.focus()}document.getElementById('cast').onclick=voiceCast;document.getElementById('closeVoice').onclick=closeVoice;document.getElementById('voiceInput').onkeydown=e=>{if(e.key==='Enter')voiceCast()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;document.getElementById('mic').onclick=()=>{if(!SR){document.getElementById('voiceState').textContent='此浏览器不支持语音识别，请输入咒语。';return}const r=new SR();r.lang='zh-CN';r.interimResults=false;r.onstart=()=>document.getElementById('voiceState').textContent='正在聆听咏唱……';r.onresult=e=>{const t=e.results[0][0].transcript;document.getElementById('voiceInput').value=t;voiceCast()};r.onerror=e=>document.getElementById('voiceState').textContent='识别失败：'+e.error;r.start()};
const spellGrid=document.getElementById('spells');Object.values(spells).forEach((s,i)=>{const d=document.createElement('div');d.className='spell';d.innerHTML=`<b>${i+1}. ${s.name}</b><span>${s.words}</span>`;d.onclick=()=>cast(s.id);spellGrid.appendChild(d)});
function interact(){const p=state.player;if(dist(p,{x:15,z:18})<6&&state.quest===0){state.quest=1;announce('【系统】你学会了第一句咏唱：火焰·长枪·穿刺。');return}if(dist(p,{x:30,z:14})<7&&state.quest>=1){const i=p.inventory;if(i.wood>=2&&i.iron>=2&&i.dust>=3&&!p.focus){i.wood-=2;i.iron-=2;i.dust-=3;p.focus=true;state.ruins=true;announce('【制造公告】初阶魔导器完成，封锁遗迹已解禁。')}else announce(`【锻坊】需要灰烬木2、陨铁2、符文尘3。当前 ${i.wood}/${i.iron}/${i.dust}`);return}if(dist(p,{x:89,z:80})<7&&!state.ruins){announce('【遗迹门】需要初阶魔导器才能解除封印。');return}}
function saveGame(){localStorage.setItem('rncs-ashen-frontier-3d',JSON.stringify(state));announce('【系统】世界状态已保存。')}function loadGame(){try{const s=JSON.parse(localStorage.getItem('rncs-ashen-frontier-3d'));if(s)Object.assign(state,s)}catch(e){console.warn(e)}}loadGame();
function announce(t){state.announcement=t;document.getElementById('announce').textContent=t;clearTimeout(announce.t);announce.t=setTimeout(()=>document.getElementById('announce').textContent='',4200)}announce(state.announcement);
function beep(freq,dur,vol){try{const ac=beep.ac||(beep.ac=new(window.AudioContext||window.webkitAudioContext)()),o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.stop(ac.currentTime+dur)}catch{}}
function burst(x,y,z,c,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=.8+Math.random()*4;state.particles.push({x,y,z,vx:Math.cos(a)*s,vy:1+Math.random()*4,vz:Math.sin(a)*s,ttl:.4+Math.random()*.8,color:c})}}
function moveDir(){let x=touchMove.x,z=touchMove.z;if(keys.KeyW||keys.ArrowUp)z+=1;if(keys.KeyS||keys.ArrowDown)z-=1;if(keys.KeyA||keys.ArrowLeft)x-=1;if(keys.KeyD||keys.ArrowRight)x+=1;if(Math.hypot(x,z)<.05)return{x:Math.sin(state.player.yaw),z:Math.cos(state.player.yaw)};const sy=Math.sin(camera.yaw),cy=Math.cos(camera.yaw);return norm(x*cy+z*sy,z*cy-x*sy)}function aimDir(){if(state.locked&&state.locked.alive)return norm(state.locked.x-state.player.x,state.locked.z-state.player.z);return{x:Math.sin(state.player.yaw),z:Math.cos(state.player.yaw)}}
function update(dt){const p=state.player;state.time+=dt;p.attackCd=Math.max(0,p.attackCd-dt);p.dodgeCd=Math.max(0,p.dodgeCd-dt);p.inv=Math.max(0,p.inv-dt);p.mp=clamp(p.mp+5*dt,0,p.maxMp);p.st=clamp(p.st+14*dt,0,p.maxSt);for(const k in p.cooldowns)p.cooldowns[k]=Math.max(0,p.cooldowns[k]-dt);
 const d=moveDir(),moving=(keys.KeyW||keys.KeyS||keys.KeyA||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight||Math.hypot(touchMove.x,touchMove.z)>.1);if(moving){const run=keys.ControlLeft||keys.ControlRight,s=run&&p.st>0?8.5:5.4;p.x=clamp(p.x+d.x*s*dt,2,108);p.z=clamp(p.z+d.z*s*dt,2,108);p.yaw=Math.atan2(d.x,d.z);if(run)p.st-=12*dt}if(state.locked&&!state.locked.alive)state.locked=null;
 for(const n of state.npcs){let v=norm(n.tx-n.x,n.tz-n.z);n.x+=v.x*n.speed*dt;n.z+=v.z*n.speed*dt;if(Math.hypot(n.tx-n.x,n.tz-n.z)<1){n.tx=7+Math.random()*96;n.tz=7+Math.random()*96}}
 for(const e of state.enemies){if(!e.alive)continue;e.cd=Math.max(0,e.cd-dt);if(e.boss)e.phase=e.hp<e.maxHp*.33?3:e.hp<e.maxHp*.66?2:1;const ds=dist(p,e);if(ds<(e.boss?40:20)&&ds>(e.boss?3.4:2)){let v=norm(p.x-e.x,p.z-e.z);e.x+=v.x*e.speed*dt;e.z+=v.z*e.speed*dt}else if(ds< (e.boss?3.8:2.2)&&e.cd<=0){e.cd=e.boss?Math.max(.7,1.7-e.phase*.25):1.4;if(p.inv<=0){let dmg=e.damage*(e.boss?.7+e.phase*.18:1),b=Math.min(p.shield,dmg);p.shield-=b;dmg-=b;p.hp-=dmg;burst(p.x,1,p.z,[1,.1,.1],10)}}}
 for(const q of state.projectiles){q.x+=q.vx*dt;q.z+=q.vz*dt;q.ttl-=dt;const e=state.enemies.find(e=>e.alive&&dist(q,e)<(e.boss?2.8:1.6));if(e){damage(e,q.damage);q.ttl=0}}state.projectiles=state.projectiles.filter(q=>q.ttl>0);
 for(const q of state.particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vy-=7*dt;q.ttl-=dt}state.particles=state.particles.filter(q=>q.ttl>0);
 if(p.hp<=0){p.hp=p.maxHp;p.mp=p.maxMp;p.x=20;p.z=19;announce('【复苏】你在边境城镇重新苏醒。')}
}
function drawCharacter(p,color=C.player,scale=1,weapon=true){const bob=Math.sin(state.time*7+p.x)*.04;draw(cube,[p.x,1.25*scale+bob,p.z],[.72*scale,1.25*scale,.48*scale],color,p.yaw);draw(sphere,[p.x,2.3*scale+bob,p.z],[.48*scale,.48*scale,.48*scale],C.skin,p.yaw);const sy=Math.sin(p.yaw),cy=Math.cos(p.yaw);draw(cube,[p.x+cy*.5*scale,1.35*scale+bob,p.z-sy*.5*scale],[.18*scale,.92*scale,.18*scale],color,p.yaw);draw(cube,[p.x-cy*.5*scale,1.35*scale+bob,p.z+sy*.5*scale],[.18*scale,.92*scale,.18*scale],color,p.yaw);if(weapon)draw(cube,[p.x+cy*.7*scale,1.4*scale+bob,p.z-sy*.7*scale],[.08*scale,1.4*scale,.08*scale],C.steel,p.yaw+.25)}
function drawEnemy(e){if(!e.alive)return;const s=e.boss?2.4:e.type==='sentinel'?1.35:e.type==='wolf'?.95:.8;draw(cube,[e.x,s,e.z],[s*1.25,s*1.5,s],e.color,Math.atan2(state.player.x-e.x,state.player.z-e.z));if(e.type==='wolf'){draw(cube,[e.x,1.15,e.z-.65],[.65,.55,1.25],e.color);draw(cube,[e.x,1.45,e.z-1.3],[.48,.48,.55],e.color)}if(e.boss){draw(sphere,[e.x,3.8,e.z],[1.2,1.2,1.2],[1,.24,.05]);draw(cube,[e.x,5.0,e.z],[.35,1.8,.35],[.8,.55,.12],.7)}if(state.locked===e)draw(sphere,[e.x,(e.boss?6:3),e.z],[.18,.18,.18],[1,1,.2])}
function render(){resize();gl.enable(gl.DEPTH_TEST);gl.enable(gl.CULL_FACE);gl.clearColor(.13,.19,.24,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const p=state.player;if(state.locked&&state.locked.alive)camera.yaw=Math.atan2(state.locked.x-p.x,state.locked.z-p.z)+Math.PI;const cp=Math.cos(camera.pitch),sp=Math.sin(camera.pitch),sy=Math.sin(camera.yaw),cy=Math.cos(camera.yaw);const eye=[p.x+sy*cp*camera.dist,2.1+sp*camera.dist,p.z+cy*cp*camera.dist],at=[p.x,1.5,p.z];gl.uniformMatrix4fv(U.view,false,M.look(eye,at));gl.uniformMatrix4fv(U.proj,false,M.persp(Math.PI/3,canvas.width/canvas.height,.1,240));gl.uniform3fv(U.light,[.45,1,.25]);gl.uniform3fv(U.cam,eye);gl.uniform3fv(U.fog,[.16,.21,.25]);
 draw(cube,[55,-.6,55],[112,1,112],C.ground);draw(cube,[24,-.04,21],[40,.06,7],C.road,.2);draw(cube,[56,-.02,55],[75,.05,5],C.road,.75);draw(cube,[95,-.08,88],[25,.08,25],[.28,.23,.21]);
 for(const b of buildings){draw(cube,[b.x,b.h/2,b.z],[b.w,b.h,b.d],b.c);draw(cube,[b.x,b.h+.8,b.z],[b.w*1.08,1.5,b.d*1.08],C.roof,.15)}
 draw(cube,[89,3.5,80],[2,7,13],state.ruins?[.24,.32,.36]:[.22,.18,.27]);draw(cube,[107,5,96],[2,10,14],[.26,.35,.5]);
 for(const t of trees){draw(cube,[t.x,t.s*1.5,t.z],[.28*t.s,3*t.s,.28*t.s],C.wood);draw(sphere,[t.x,3.3*t.s,t.z],[1.1*t.s,1.6*t.s,1.1*t.s],t.ash?C.ash:C.leaf)}for(const r of rocks)draw(sphere,[r.x,r.s*.45,r.z],[r.s,r.s*.7,r.s*.85],C.stone);
 drawCharacter(p);for(const n of state.npcs)drawCharacter(n,n.color,.72,false);for(const e of state.enemies)drawEnemy(e);for(const q of state.projectiles)draw(sphere,[q.x,1.4,q.z],[.3,.3,.65],q.color);for(const q of state.particles)draw(cube,[q.x,q.y,q.z],[.08,.08,.08],q.color);
 updateHud();}
function updateHud(){const p=state.player;document.getElementById('pname').textContent=`${p.name} Lv.${p.lv} · 金币 ${p.gold}`;document.getElementById('hp').style.width=clamp(p.hp/p.maxHp*100,0,100)+'%';document.getElementById('mp').style.width=p.mp/p.maxMp*100+'%';document.getElementById('st').style.width=p.st/p.maxSt*100+'%';let qt='主线：第一句咏唱',qd='前往蓝色法师公会旁寻找莱拉，按 E 交互。';if(state.quest>=1&&!p.focus){qt='主线：魔导器的骨架';qd=`收集 灰烬木 ${p.inventory.wood}/2 · 陨铁 ${p.inventory.iron}/2 · 符文尘 ${p.inventory.dust}/3，前往锻坊。`}if(p.focus&&!state.bossDead){qt='主线：封锁遗迹';qd='前往地图东北方的遗迹，挑战熔心守卫。'}if(state.bossDead){qt='Season 0 序章完成';qd='浮空学院航道已登记，等待下个版本开放。'}document.getElementById('qtitle').textContent=qt;document.getElementById('qdesc').textContent=qd;const boss=state.enemies.find(e=>e.boss&&e.alive);document.getElementById('boss').style.display=boss&&dist(p,boss)<45?'block':'none';if(boss){document.getElementById('bossHp').style.width=boss.hp/boss.maxHp*100+'%';document.getElementById('phase').textContent=['','阶段 I','阶段 II','阶段 III'][boss.phase]}
 let prompt='';if(dist(p,{x:15,z:18})<6&&state.quest===0)prompt='E · 与咏唱导师莱拉交谈';else if(dist(p,{x:30,z:14})<7&&!p.focus)prompt='E · 使用赤铁锻坊';else if(dist(p,{x:89,z:80})<7&&!state.ruins)prompt='E · 检查封锁遗迹';const el=document.getElementById('prompt');el.style.display=prompt?'block':'none';el.textContent=prompt;for(const [id,sp] of Object.entries(spells)){const i=Object.keys(spells).indexOf(id),node=spellGrid.children[i];node.classList.toggle('cd',(p.cooldowns[id]||0)>0);node.title=(p.cooldowns[id]||0).toFixed(1)}document.getElementById('fps').textContent=`HP ${Math.ceil(p.hp)} · MP ${Math.ceil(p.mp)} · 护盾 ${Math.ceil(p.shield)} · 击败 ${state.kills}`;}
function resize(){const d=Math.min(devicePixelRatio||1,1.75),w=Math.floor(innerWidth*d),h=Math.floor(innerHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)}}let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(voiceBox.style.display!=='block')update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null;function stickUpdate(e){const r=stick.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2),m=Math.min(1,Math.hypot(x,y)/(r.width*.42)),a=Math.atan2(y,x);touchMove={x:Math.cos(a)*m,z:-Math.sin(a)*m};knob.style.transform=`translate(${touchMove.x*38}px,${-touchMove.z*38}px)`}stick.onpointerdown=e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickUpdate(e)};stick.onpointermove=e=>{if(e.pointerId===stickId)stickUpdate(e)};stick.onpointerup=()=>{stickId=null;touchMove={x:0,z:0};knob.style.transform=''};document.getElementById('tAtk').onclick=attack;document.getElementById('tDodge').onclick=dodge;document.getElementById('tMagic').onclick=openVoice;document.getElementById('tLock').onclick=toggleLock;
