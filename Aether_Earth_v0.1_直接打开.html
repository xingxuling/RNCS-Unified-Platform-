<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <title>Aether Earth · RCL 集体智能地球</title>
  <style>:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#040a12;color:#e8f1ff;--panel:#0a1626cc;--line:#1d3857;--muted:#89a2be;--accent:#76e4c4;--blue:#5ca8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 8%,#123159 0,#07111f 28%,#03070d 70%);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}main{width:min(1400px,100%);margin:auto;padding:22px}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;margin-bottom:20px}h1{font-size:clamp(38px,7vw,72px);line-height:.9;margin:4px 0 10px;letter-spacing:-.06em}h2{font-size:18px;margin:4px 0}.subtitle,.eyebrow,small{color:var(--muted)}.eyebrow,small{font-size:11px;letter-spacing:.16em}.status{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:#081321}.status span{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}.hero-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,.8fr);gap:16px}.dashboard{display:grid;gap:16px}.panel{background:linear-gradient(145deg,#0c1b2dda,#07111fef);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 18px 70px #0007;backdrop-filter:blur(18px)}.panel-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.panel-title b{color:var(--accent)}canvas{display:block;width:100%;aspect-ratio:1;border-radius:16px;background:#03101a;border:1px solid #153653;image-rendering:pixelated}.controls,.speed-control{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.speed-control{align-items:center;color:var(--muted)}button,input{border:1px solid #274766;background:#0b1b2d;color:#dcecff;border-radius:12px;padding:10px 13px;font:inherit}button{cursor:pointer}button:hover,button.active{border-color:var(--accent);color:var(--accent)}button.primary{background:linear-gradient(135deg,#1a7fd1,#2fae91);border:0;color:white;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric{padding:12px;border-radius:14px;background:#071321;border:1px solid #162d45}.metric b{display:block;font-size:23px;margin-top:4px}.list{display:grid;gap:8px;max-height:260px;overflow:auto}.list.empty{color:var(--muted);padding:18px 0}.item{padding:10px;border:1px solid #17314c;border-radius:12px;background:#071321}.item small{display:block;margin-bottom:4px}.item b{font-size:13px}.item p{font-size:12px;color:var(--muted);margin:5px 0 0}input{width:100%;margin-bottom:10px}.agents-panel{margin-top:16px}.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px;max-height:360px;overflow:auto}.agent{padding:10px;border-radius:13px;border:1px solid #17314c;background:#071321}.agent header{display:block;margin:0}.agent b{font-size:12px}.agent p{font-size:11px;color:var(--muted);margin:4px 0}.bar{height:4px;background:#14283d;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--accent))}@media(max-width:900px){main{padding:14px}.hero-grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.world-card{padding:12px}.dashboard{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(4,1fr)}.metric b{font-size:18px}.metric{padding:9px}}@media(max-width:580px){.metrics{grid-template-columns:repeat(2,1fr)}.controls button{flex:1}.agents{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">RNCS · RCL REALITY LAB</p>
        <h1>Aether Earth</h1>
        <p class="subtitle">100 个少数据 AI 生物，在压缩时空中共同形成可运行知识。</p>
      </div>
      <div class="status"><span id="runtimeDot"></span><b id="runtimeMode">浏览器沙盒</b></div>
    </header>

    <section class="hero-grid">
      <article class="world-card panel">
        <div class="panel-title"><div><small>SIMULATED EARTH</small><h2>16 × 16 地球瓦片</h2></div><b id="dayLabel">Day 0</b></div>
        <canvas id="world" width="640" height="640" aria-label="Aether Earth world map"></canvas>
        <div class="controls">
          <button data-days="1">+1 天</button>
          <button data-days="10">+10 天</button>
          <button data-days="100" class="primary">+100 天</button>
          <button id="backgroundButton">后台持续世界</button>
        </div>
        <div class="speed-control">
          <span>时间倍率</span>
          <button data-speed="1" class="active">1×</button>
          <button data-speed="10">10×</button>
          <button data-speed="100">100×</button>
        </div>
      </article>

      <aside class="dashboard">
        <section class="metrics panel" id="metrics"></section>
        <section class="panel">
          <div class="panel-title"><div><small>COLLECTIVE CRYSTALS</small><h2>集体智能结晶</h2></div><b id="crystalCount">0</b></div>
          <div id="crystals" class="list empty">等待群体形成稳定模式……</div>
        </section>
        <section class="panel">
          <div class="panel-title"><div><small>RCLPEDIA</small><h2>可运行百科</h2></div><b id="knowledgeCount">512</b></div>
          <input id="search" placeholder="搜索气候、资源或知识关系" />
          <div id="knowledge" class="list"></div>
        </section>
      </aside>
    </section>

    <section class="panel agents-panel">
      <div class="panel-title"><div><small>LIVING SUBJECTS</small><h2>100 个 RCL 生物</h2></div><button id="exportButton">导出压缩现实</button></div>
      <div id="agents" class="agents"></div>
    </section>
  </main>
  <script>(() => {
  const climates = ['oceanic','temperate','arid','tundra'];
  const climateColors = {oceanic:'#17658c',temperate:'#2c8158',arid:'#9b7237',tundra:'#8da8b7'};
  let seed = 20260704 >>> 0;
  const rnd = () => { seed ^= seed << 13; seed ^= seed >>> 17; seed ^= seed << 5; return (seed >>> 0) / 4294967296; };
  const state = {day:0,timeScale:1,tiles:[],agents:[],knowledge:512,crystals:[],background:false};
  const native = window.AetherEarthNative || null;
  const canvas = document.getElementById('world'); const ctx = canvas.getContext('2d');
  for(let y=0;y<16;y++) for(let x=0;x<16;x++){const lat=Math.abs(y/15*2-1);let c=lat>.78?'tundra':rnd()<.24?'arid':rnd()>.75?'oceanic':'temperate';state.tiles.push({x,y,c,b:.2+rnd()*.7});}
  for(let i=0;i<100;i++)state.agents.push({id:`life:${String(i+1).padStart(3,'0')}`,x:(rnd()*16)|0,y:(rnd()*16)|0,e:55+rnd()*40,k:0,g:1,a:['Forager','Scholar','Cooperator','Explorer'][i%4],action:'rest'});
  function browserAdvance(days){for(let d=0;d<days;d++){state.day++;for(const t of state.tiles)t.b=Math.min(1,t.b+.004);for(const a of state.agents){const t=state.tiles[a.y*16+a.x];a.e-=.7;if(a.e<48&&t.b>.04){a.action='forage';const gain=Math.min(7,t.b*10);a.e=Math.min(100,a.e+gain);t.b=Math.max(0,t.b-gain/45);if(rnd()<.07){a.k++;state.knowledge++;}}else if(rnd()<.18){a.action='move';a.x=(a.x+((rnd()*3)|0)-1+16)%16;a.y=(a.y+((rnd()*3)|0)-1+16)%16;}else if(rnd()<.07){a.action='experiment';a.k++;state.knowledge++;}else a.action='rest';if(a.e<=0){a.g++;a.e=70+rnd()*20;a.k=Math.max(0,a.k-2);}}if(state.day%60===0){const c={id:`crystal-${state.crystals.length+1}`,strategy:'prefer_temperate_biomass',confidence:Math.min(.99,.68+state.day/10000),support:24+((rnd()*60)|0),promoted:true};state.crystals.push(c);}}render();}
  function nativeState(){try{return native?JSON.parse(native.getState()):null}catch(e){console.error(e);return null}}
  function syncFromNative(){const n=nativeState();if(!n)return;Object.assign(state,n);render();}
  function advance(days){if(native){native.advance(days);syncFromNative()}else browserAdvance(days);}
  function draw(){const s=canvas.width/16;ctx.clearRect(0,0,canvas.width,canvas.height);for(const t of state.tiles){ctx.fillStyle=climateColors[t.c||t.climate]||'#315';ctx.globalAlpha=.42+.58*(t.b??t.biomass??.5);ctx.fillRect(t.x*s,t.y*s,s+1,s+1)}ctx.globalAlpha=1;for(const a of state.agents){ctx.beginPath();ctx.fillStyle=a.action==='experiment'?'#ffd36b':a.action==='forage'?'#76e4c4':'#f1f6ff';ctx.arc((a.x+.5)*s,(a.y+.5)*s,Math.max(2,s*.13),0,Math.PI*2);ctx.fill();}}
  function render(){draw();document.getElementById('dayLabel').textContent=`Day ${state.day}`;document.getElementById('knowledgeCount').textContent=state.knowledge||512;document.getElementById('crystalCount').textContent=state.crystals.length;const avgE=state.agents.reduce((x,a)=>x+(a.e??a.energy),0)/state.agents.length;const avgK=state.agents.reduce((x,a)=>x+(a.k??(a.knowledge?.length||0)),0)/state.agents.length;document.getElementById('metrics').innerHTML=[['生物',state.agents.length],['平均能量',avgE.toFixed(1)],['知识密度',avgK.toFixed(1)],['时间倍率',`${state.timeScale}×`]].map(([k,v])=>`<div class="metric"><small>${k}</small><b>${v}</b></div>`).join('');document.getElementById('crystals').className=`list${state.crystals.length?'':' empty'}`;document.getElementById('crystals').innerHTML=state.crystals.length?state.crystals.slice(-8).reverse().map(c=>`<div class="item"><small>${c.id}</small><b>${c.strategy}</b><p>支持 ${c.support} · 置信度 ${(c.confidence*100).toFixed(1)}% · ${c.promoted?'已晋升':'候选'}</p></div>`).join(''):'等待群体形成稳定模式……';document.getElementById('agents').innerHTML=state.agents.slice(0,100).map(a=>{const e=a.e??a.energy;const k=a.k??(a.knowledge?.length||0);return `<div class="agent"><header><b>${a.id}</b></header><p>${a.a||a.archetype||a.genome?.archetype||'Life'} · G${a.g||a.generation}</p><p>${a.action||a.lastAction} · K${k}</p><div class="bar"><i style="width:${Math.max(0,Math.min(100,e))}%"></i></div></div>`}).join('');}
  function renderKnowledge(q=''){const terms=[['temperate.biomass','supports','body.energy'],['oceanic.water','supports','life.stability'],['arid.moisture','constrains','biomass.growth'],['tundra.thermal','constrains','body.energy'],['collective.experiment','supports','knowledge.discovery']];document.getElementById('knowledge').innerHTML=terms.filter(x=>x.join(' ').includes(q.toLowerCase())).map((x,i)=>`<div class="item"><small>rclpedia:${String(i+1).padStart(4,'0')}</small><b>${x[0]} ${x[1]} ${x[2]}</b><p>证据可追踪 · 置信度 ${(82+i*2)}%</p></div>`).join('');}
  document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>advance(Number(b.dataset.days)));document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{state.timeScale=Number(b.dataset.speed);if(native)native.setTimeScale(state.timeScale);document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b));render();});document.getElementById('search').oninput=e=>renderKnowledge(e.target.value);document.getElementById('backgroundButton').onclick=()=>{state.background=!state.background;if(native){state.background?native.startBackground():native.stopBackground();syncFromNative()}document.getElementById('backgroundButton').textContent=state.background?'停止后台世界':'后台持续世界'};document.getElementById('exportButton').onclick=()=>{if(native){native.exportSnapshot();return}const blob=new Blob([JSON.stringify(state)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`aether-earth-day-${state.day}.json`;a.click();};
  if(native){document.getElementById('runtimeMode').textContent='Android 原生宿主';syncFromNative();setInterval(syncFromNative,3000)}else{document.getElementById('runtimeMode').textContent='浏览器沙盒';render()}renderKnowledge();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
