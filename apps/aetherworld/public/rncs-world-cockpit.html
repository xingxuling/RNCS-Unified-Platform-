<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RNCS 世界驾驶舱</title><style>body{font:14px system-ui;background:#0b1020;color:#e8eefc;margin:0;padding:20px}main{max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}section{background:#121a2f;border:1px solid #2d395b;border-radius:12px;padding:14px}textarea{width:100%;height:130px;background:#090e1a;color:#fff;border:1px solid #435177;border-radius:8px;padding:9px;box-sizing:border-box}button{background:#21335c;color:#fff;border:1px solid #506797;border-radius:7px;padding:8px;margin:3px}pre{white-space:pre-wrap;overflow:auto;max-height:420px;background:#080d18;padding:10px;border-radius:8px;font-size:11px}.ok{color:#7ef0b8}.bad{color:#ff8d9b}</style><main><h1>Aetherworld · RNCS 原生世界驾驶舱</h1><p id="health">正在发现 Gateway…</p><div><button onclick="discover()">发现运行时</button><button onclick="e2e()">一键完整验收</button></div><div class="grid"><section><h2>世界制造</h2><textarea id="source">创建一座小型以太岛。岛上有两个玩家出生点、一扇可开关的门、一盏蓝色能量灯和一个感应区域。玩家进入感应区域时，门自动打开，灯光增强并产生环境声音。两个客户端必须看到一致的门状态和玩家位置。</textarea><pre id="plan">等待执行</pre></section><section><h2>世界状态</h2><pre id="world">等待 Gateway</pre></section><section><h2>投影诊断</h2><pre id="projection">Authority Root 与 Presentation Root 将独立显示</pre></section><section><h2>历史与证据</h2><pre id="history">等待 RFE</pre></section></div></main><script>const base=localStorage.rncsGateway||'http://127.0.0.1:17303';async function invoke(action,payload={}){const r=await fetch(base+'/api/invoke',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({runtime_id:'rncs.aetherworld-native',action,payload})});const j=await r.json();if(!r.ok)throw Error(j.error?.message||j.error);return j}async function discover(){try{const reg=await fetch(base+'/api/runtimes').then(r=>r.json()),rt=reg.runtimes.find(x=>x.runtime_id==='rncs.aetherworld-native');if(!rt)throw Error('Provider缺失');const h=await invoke('health');health.className='ok';health.textContent=`${rt.runtime_id} ${rt.runtime_version} · ${h.protocol} · ${h.state_root}`;world.textContent=JSON.stringify(await invoke('worldStatus'),null,2);history.textContent=JSON.stringify(await invoke('history'),null,2)}catch(e){health.className='bad';health.textContent=e.message}}async function e2e(){try{const x=await invoke('runEndToEnd',{source:source.value});plan.textContent=JSON.stringify(x.plan,null,2);world.textContent=JSON.stringify(x.merge,null,2);projection.textContent=JSON.stringify(x.loopback.projection,null,2);history.textContent=JSON.stringify(x.history,null,2);health.className=Object.values(x.acceptance).every(Boolean)?'ok':'bad';health.textContent=JSON.stringify(x.acceptance)}catch(e){health.className='bad';health.textContent=e.message}}discover()</script></html>
