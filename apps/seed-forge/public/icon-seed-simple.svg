<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background: Deep Blue with subtle gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="512" height="512" fill="url(#bgGradient)" rx="80"/>
  
  <!-- Main Symbol: Seed Circle with Diagonal (Empty Set) -->
  <g transform="translate(256, 200)" filter="url(#glow)">
    <!-- Outer Circle -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="url(#cyanGradient)" stroke-width="18" opacity="0.95"/>
    
    <!-- Inner Circle -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="url(#cyanGradient)" stroke-width="14" opacity="0.8"/>
    
    <!-- Diagonal Line (Empty Set Symbol) -->
    <line x1="-85" y1="-85" x2="85" y2="85" stroke="url(#cyanGradient)" stroke-width="22" stroke-linecap="round" opacity="1"/>
    
    <!-- Center Core (Seed) -->
    <circle cx="0" cy="0" r="14" fill="#0ea5e9" opacity="1"/>
    
    <!-- Orbital Energy Particles -->
    <circle cx="0" cy="-140" r="5" fill="#0ea5e9" opacity="0.9"/>
    <circle cx="99" cy="99" r="4" fill="#0ea5e9" opacity="0.8"/>
    <circle cx="-99" cy="99" r="4" fill="#0ea5e9" opacity="0.8"/>
    <circle cx="99" cy="-99" r="4" fill="#0ea5e9" opacity="0.8"/>
    <circle cx="-99" cy="-99" r="4" fill="#0ea5e9" opacity="0.8"/>
    
    <!-- Additional small particles -->
    <circle cx="0" cy="140" r="3" fill="#0ea5e9" opacity="0.7"/>
    <circle cx="140" cy="0" r="3" fill="#0ea5e9" opacity="0.7"/>
    <circle cx="-140" cy="0" r="3" fill="#0ea5e9" opacity="0.7"/>
  </g>
  
  <!-- Text: THE SEED ENGINE -->
  <g transform="translate(256, 360)" opacity="0.95">
    <text x="0" y="0" font-family="'Arial', 'Helvetica', sans-serif" font-size="36" font-weight="bold" fill="#0ea5e9" text-anchor="middle" letter-spacing="3">THE SEED</text>
    <text x="0" y="42" font-family="'Arial', 'Helvetica', sans-serif" font-size="36" font-weight="bold" fill="#0ea5e9" text-anchor="middle" letter-spacing="3">ENGINE</text>
  </g>
</svg>

