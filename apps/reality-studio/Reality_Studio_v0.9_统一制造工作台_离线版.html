canvas.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/asset-id');if(!id)return;const p=canvasPoint(e);command('add-asset-node',{asset_id:id,x:p.x,y:p.y,bind_entity:true});toast('资产已进入场景并绑定行为实体')}
function renderInspector(){const n=currentScene().nodes.find(n=>n.node_id===selectedNodeId);if(!n){$('#inspectTitle').textContent='未选择节点';$('#inspectSub').textContent='选择场景节点进行编辑';$('#selectionKind').textContent='—';$('#inspector').innerHTML='';return}const a=project.assets.registry[n.asset_id];$('#inspectTitle').textContent=n.name;$('#inspectSub').textContent=n.node_id;$('#selectionKind').textContent=a?.kind||'node';$('#inspector').innerHTML=`<div class="field"><label>名称</label><input id="fName" value="${esc(n.name)}"></div><div class="field-row"><div class="field"><label>X</label><input id="fX" type="number" value="${Math.round(n.transform.x)}"></div><div class="field"><label>Y</label><input id="fY" type="number" value="${Math.round(n.transform.y)}"></div></div><div class="field-row"><div class="field"><label>旋转（度）</label><input id="fRot" type="number" value="${(n.transform.rotation_mdeg||0)/1000}"></div><div class="field"><label>层级</label><input id="fZ" type="number" value="${n.z_index||0}"></div></div><div class="field"><label>资产身份</label><input value="${esc(n.asset_id||'')}" disabled></div><div class="field"><label>行为实体</label><input value="${esc(n.behavior_binding?.entity_id||'未绑定')}" disabled></div><div class="inspect-actions"><button id="applyNode" class="primary">应用修改</button><button id="deleteNode">删除</button></div>`;$('#applyNode').onclick=()=>command('patch-node',{node_id:n.node_id,patch:{name:$('#fName').value,z_index:Number($('#fZ').value),transform:{x:Number($('#fX').value),y:Number($('#fY').value),rotation_mdeg:Math.round(Number($('#fRot').value)*1000)}}});$('#deleteNode').onclick=()=>command('remove-node',{node_id:n.node_id})}
function renderWatch(){const r=inspection?.behavior?.runtime||localBehaviorState(),p=r.entities?.player?.variables||{},e=r.entities?.enemy?.variables||{};$('#watch').innerHTML=`<div><span>player.health</span><b>${Math.round(p.health??100)}</b></div><div><span>enemy.health</span><b>${Math.round(e.health??75)}</b></div><div><span>globals.score</span><b>${r.globals?.score??0}</b></div><div><span>player.state</span><b>${r.machines?.['machine:player']?.state||'idle'}</b></div><div><span>State Root</span><b>${esc(String(r.state_root||'offline').slice(0,12))}</b></div>`}
function renderTrace(){const rows=traceCleared?[]:[...(inspection?.event_tail||[]),...(inspection?.behavior?.trace_tail||[])].slice(-70).reverse();$('#trace').innerHTML=rows.map(t=>`<div class="trace-row"><b>${t.tick??t.sequence??'—'}</b><em>${esc(t.type)}</em><span>${esc(JSON.stringify(Object.fromEntries(Object.entries(t).filter(([k])=>!['tick','sequence','type','time'].includes(k)))).slice(0,220))}</span></div>`).join('')||'<div style="padding:14px;color:#7890a8">运行、拖放或编辑后，事件与因果记录会显示在这里。</div>';$('#traceMeta').textContent=`Tick ${inspection?.behavior?.runtime?.tick??0} · ${rows.length} records`}
function renderBehavior(){const graph=inspection?.behavior?.graphs?.state_machine||{nodes:[],edges:[]},svg=$('#machineGraph');svg.innerHTML=`<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#3d6c8e"/></marker></defs>`+graph.edges.map(e=>{const a=graph.nodes.find(n=>n.id===e.from),b=graph.nodes.find(n=>n.id===e.to);if(!a||!b)return'';return`<path class="g-edge" marker-end="url(#arrow)" d="M${a.x+130},${a.y+30} C${a.x+170},${a.y+30} ${b.x-40},${b.y+30} ${b.x},${b.y+30}"/>`}).join('')+graph.nodes.map(n=>`<g class="g-node ${n.initial?'active':''}" transform="translate(${n.x},${n.y})"><rect width="130" height="60" rx="9"/><text x="12" y="25">${esc(n.label)}</text><text class="sub" x="12" y="44">转移 ${n.transition_count??0}</text></g>`).join('');$('#machineMeta').textContent=`${graph.nodes.length} 状态 · ${graph.edges.length} 转移`;const rules=inspection?.behavior?.graphs?.rules?.nodes?.filter(n=>n.kind==='rule')||[];$('#ruleList').innerHTML=rules.map(r=>`<div class="rule"><b>${esc(r.label)}</b><small>${esc(r.event)} · ${r.actions} 个动作 · 优先级 ${r.priority}</small></div>`).join('');$('#ruleMeta').textContent=`${rules.length} 规则`}
function renderBuild(){const targets=project.build.targets||['web'];$('#buildCards').innerHTML=targets.map(t=>`<div class="build-card"><span>目标平台</span><b>${esc(t)}</b><span>${t==='web'?'可直接导出':'当前为预览清单'}</span></div>`).join('');$('#buildManifest').textContent=JSON.stringify({entry_scene:project.build.entry_scene_id,quality:project.build.quality_profile,assets:project.assets.order.length,nodes:currentScene().nodes.length,behavior:project.behavior.active_program_id,outputs:['project.json','scene-player.json','behavior.json','assets.json','gateway.runtime.json','web-preview.html']},null,2)}
function renderTabs(){$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView));$$('.view').forEach(v=>v.classList.remove('active'));$(`#${activeView}View`).classList.add('active');$$('[data-left]').forEach(b=>b.classList.toggle('active',b.dataset.left===leftTab));$('#scenePanel').classList.toggle('hidden',leftTab!=='scene');$('#assetPanel').classList.toggle('hidden',leftTab!=='assets')}
function render(){inspection=inspection||localInspect();renderTabs();renderSceneTree();renderAssets();renderInspector();renderWatch();renderTrace();renderBehavior();renderBuild();drawScene();$('#projectTitle').textContent=project.identity.title;$('#sceneTitle').textContent=currentScene().title;$('#projectRoot').textContent=String(inspection.project?.project_root||project.project_root).slice(0,18);$('#rootBadge').textContent=`Root ${String(inspection.scene?.projection?.projection_root||'offline').slice(0,12)}`;$('#tick').textContent=inspection.behavior?.runtime?.tick??0;$('#modeBadge').textContent=running?'运行模式':'编辑模式';$('#modeBadge').style.color=running?'#4ade80':'';$('#footerStatus').textContent=`${server?'Native':'Offline'} · ${inspection.validation?.valid?'Valid':'Invalid'} · ${currentScene().nodes.length} nodes`;$('#undoBtn').disabled=!inspection.editor?.can_undo;$('#redoBtn').disabled=!inspection.editor?.can_redo}
function inputState(){return{move_left:keys.ArrowLeft||keys.KeyA,move_right:keys.ArrowRight||keys.KeyD,attack:keys.Space||keys.KeyJ}}
async function startRun(){if(running)return;running=true;render();runTimer=setInterval(async()=>{if(server){inspection=await api('/api/unified/session/command',{session_id:sessionId,command:'step',input:inputState()});syncProjectFromSession()}else localCommand('step',{input:inputState()});render()},50)}
function stopRun(){running=false;if(runTimer){clearInterval(runTimer);runTimer=null}render()}
async function exportRuntime(){try{const out=server?await api('/api/unified/session/export',{session_id:sessionId}):{project,scene_player:localInspect().scene.projection,behavior_program:project.behavior.programs[project.behavior.active_program_id]};download('Reality_Studio_v0.9_统一运行包.json',out);toast('统一运行包已导出')}catch(e){toast(e.message)}}
async function detect(){try{const h=await api('/api/health');server=true;$('#serverDot').className='dot ok';$('#serverText').textContent=`原生服务 · v${h.studio_version}`;project=await api('/api/unified/sample')}catch{server=false;$('#serverDot').className='dot warn';$('#serverText').textContent='离线统一制造';project=clone(window.SAMPLE_UNIFIED)}await createSession()}
$$('[data-view]').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;render()});$$('[data-left]').forEach(b=>b.onclick=()=>{leftTab=b.dataset.left;render()});$('#playBtn').onclick=startRun;$('#pauseBtn').onclick=stopRun;$('#stepBtn').onclick=()=>command('step',{input:inputState()});$('#resetBtn').onclick=()=>{stopRun();command('reset')};$('#undoBtn').onclick=()=>command('undo');$('#redoBtn').onclick=()=>command('redo');$('#snapBtn').onclick=()=>{project.editor.snap_to_grid=!project.editor.snap_to_grid;$('#snapBtn').classList.toggle('on',project.editor.snap_to_grid);drawScene()};$('#gridBtn').onclick=()=>{project.editor.snap_to_grid=!project.editor.snap_to_grid;$('#gridBtn').classList.toggle('on',project.editor.snap_to_grid);drawScene()};$('#validateBtn').onclick=async()=>{const v=server?await api('/api/unified/validate',{project}):{valid:true,errors:[]};toast(v.valid?'统一项目校验通过':`${v.errors.length} 项错误`)};$('#exportBtn').onclick=exportRuntime;$('#saveBtn').onclick=()=>download(`${project.identity.title}.unified-project.json`,project);$('#openBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{try{project=JSON.parse(await e.target.files[0].text());await createSession();toast('项目已打开')}catch(x){toast(x.message)}e.target.value=''};$('#newBtn').onclick=()=>{project=clone(window.SAMPLE_UNIFIED);project.identity.title='新统一世界';createSession()};$('#clearTraceBtn').onclick=()=>{traceCleared=true;renderTrace()};
const keys={};window.addEventListener('keydown',e=>{keys[e.code]=true;if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault()});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('beforeunload',stopRun);
detect().catch(e=>{document.body.innerHTML=`<pre style="padding:30px;color:#fecaca">Reality Studio v0.9 启动失败\n${esc(e.stack||e.message)}</pre>`});
})();
</script></body></html>
