<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reality Studio v1.5 资产创生工作台</title><style>:root{color-scheme:dark;font-family:Inter,"Noto Sans SC",system-ui,sans-serif;background:#07101d;color:#e9f3ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#12345b 0,#07101d 35%,#040912 100%);min-height:100vh}header{height:68px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #24415f;background:#081321e8;position:sticky;top:0;z-index:5}header div{display:flex;gap:14px;align-items:baseline}header b{font-size:20px}header span,header i{color:#8db6dd;font-style:normal}header nav{display:flex;gap:18px;align-items:center}a{color:#79c9ff;text-decoration:none}main{display:grid;grid-template-columns:minmax(320px,420px) minmax(420px,1fr);gap:16px;padding:18px;max-width:1500px;margin:auto}.panel{background:#0b1726e8;border:1px solid #23415f;border-radius:16px;padding:18px;box-shadow:0 18px 60px #0008}.intent{grid-row:span 2}.evidence{grid-column:1/-1}h1{font-size:24px;margin:0 0 16px}h2{font-size:17px;margin:0}.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.head span{font-size:12px;color:#82a7ca}textarea,input,select{width:100%;background:#07111e;border:1px solid #315574;color:#eff8ff;border-radius:10px;padding:11px;margin-top:7px}textarea{height:150px;resize:vertical;line-height:1.6}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}label{display:block;color:#afc9e1;font-size:13px;margin:12px 0}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}button{border:1px solid #3b6689;background:#14283d;color:#e9f5ff;padding:10px 13px;border-radius:10px;cursor:pointer}button:hover{filter:brightness(1.18)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#176db2}.accept{background:#12744c}pre{white-space:pre-wrap;background:#050b13;border-radius:10px;padding:12px;min-height:78px;color:#8fc9f2}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.candidate{border:1px solid #2e526e;border-radius:12px;padding:12px;background:#0a1320;cursor:pointer}.candidate.selected{border-color:#59c5ff;box-shadow:0 0 0 2px #1a86c855}.candidate b{display:block;font-size:15px}.candidate small{display:block;color:#87a9c6;margin:5px 0}.score{font-size:22px;color:#7ae0b2}.gates{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.gates i{font-size:10px;font-style:normal;background:#15304a;border-radius:5px;padding:3px 5px}.empty{color:#6987a1;padding:30px;text-align:center;grid-column:1/-1}canvas{width:100%;height:auto;background:linear-gradient(#07101a,#0b1d2f);border:1px solid #274966;border-radius:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.metric{background:#07111e;border-radius:8px;padding:9px}.metric span{display:block;color:#7197b7;font-size:11px}.metric b{font-size:15px}.evidence #evidence{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.evidence article{background:#07111e;padding:10px;border-radius:9px}.evidence small{color:#7197b7;display:block}.evidence code{font-size:11px;word-break:break-all;color:#a9ddff}@media(max-width:900px){main{grid-template-columns:1fr}.intent{grid-row:auto}.evidence{grid-column:auto}.cards{grid-template-columns:1fr}.metrics,.evidence #evidence{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div><b>Reality Studio v1.5</b><span>资产创生工作台 · RAGF v0.4 · 离线可连接原生服务</span></div><nav><a href="/">返回统一制造</a><i id="connection">连接中</i></nav></header>
<main><section class="intent panel"><h1>从资产意图到可运行实体</h1><textarea id="description">创建一名冰属性三维女剑士，名字叫霜璃，属于北境守望者。动作敏捷，蓝白战斗服，攻击前有清晰预警。</textarea><div class="row"><label>资产类型<select id="kind"><option value="character-3d">3D角色</option><option value="prop-3d">3D道具</option><option value="environment-3d">3D环境</option></select></label><label>平台<select id="platform"><option value="desktop,mobile,web,xr">全平台</option><option value="mobile,web">手机与Web</option><option value="desktop,xr">桌面与XR</option></select></label></div><label>配色<input id="palette" value="#1c4fa3,#f2f6ff,#9ddcff,#17305a"></label><div class="actions"><button id="generate" class="primary">生成三个候选</button><button id="regenerate">按当前配色定点再生</button><button id="accept" class="accept">接受并放入场景</button></div><pre id="status">准备创建统一制造会话…</pre></section>
<section class="candidates panel"><div class="head"><h2>候选资产</h2><span id="generation">Generation —</span></div><div id="cards" class="cards"><div class="empty">尚未生成</div></div></section>
<section class="preview panel"><div class="head"><h2>真实结构预览</h2><span id="previewRoot">Preview Root —</span></div><canvas id="canvas" width="640" height="420"></canvas><div id="metrics" class="metrics"></div></section>
<section class="evidence panel"><h2>制造证据</h2><div id="evidence"></div></section></main>
<script>const $=id=>document.getElementById(id),state={unified:null,forge:null,inspection:null,preview:null,angle:0};
const post=async(route,body)=>{const response=await fetch(route,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}),data=await response.json();if(!response.ok||data.error)throw new Error(data.error?.message||`HTTP ${response.status}`);return data};
const short=value=>value?String(value).slice(0,12)+'…':'—';
function setStatus(value){$('status').textContent=typeof value==='string'?value:JSON.stringify(value,null,2)}
function intent(){return{description:$('description').value,subject_id:'subject:studio-asset-forge',asset_kind:$('kind').value,functional_role:$('kind').value==='character-3d'?'player-character':'world-prop',target_platforms:$('platform').value.split(','),constraints:{palette:$('palette').value.split(',').map(x=>x.trim()),style:'stylized-readable-pbr',max_texture_size:512,max_sprite_frames:6,audio_seconds:.8,max_particles:96,max_triangles:2400,pbr_texture_size:256,max_bones:64,animation_fps:30,lod_ratios:[1,.55,.25],license_policy:'generated-or-cleared'}}}
async function boot(){try{const health=await fetch('/api/health').then(r=>r.json());$('connection').textContent=`原生服务在线 · ${health.studio_version}`;const project=await fetch('/api/unified/sample').then(r=>r.json());state.unified=await post('/api/unified/session/new',{project});setStatus(`统一制造会话已建立\n${state.unified.session_id}`)}catch(error){$('connection').textContent='离线参考模式';setStatus(`未连接原生服务：${error.message}\n请通过 node src/cli.mjs serve 启动。`)}}
async function ensureForge(){if(!state.unified)throw new Error('统一制造会话尚未建立');if(!state.forge){state.forge=await post('/api/asset-forge/session/new',{unified_session_id:state.unified.session_id,intent:intent()})}return state.forge}
function renderCandidates(){const list=state.inspection?.production?.candidates??[];$('generation').textContent=`Generation ${state.inspection?.production?.generation??'—'}`;$('cards').innerHTML=list.length?'':'<div class="empty">尚未生成</div>';for(const item of list){const card=document.createElement('article');card.className='candidate'+(item.candidate_id===state.inspection.production.selected_candidate_id?' selected':'');card.innerHTML=`<b>${item.variant}</b><small>${item.candidate_id}</small><span class="score">${Math.round((item.score?.total??0)*100)/100}</span><div class="gates">${Object.entries(item.gates).filter(([,ok])=>ok).map(([name])=>`<i>${name}</i>`).join('')}</div>`;card.onclick=async()=>{try{state.inspection=await post('/api/asset-forge/session/select',{forge_id:state.forge.forge_id,candidate_id:item.candidate_id,reason:'visual-selection'});await loadPreview();renderCandidates()}catch(error){setStatus(error.message)}};$('cards').append(card)}}
function drawMesh(){const ctx=$('canvas').getContext('2d'),w=ctx.canvas.width,h=ctx.canvas.height;ctx.clearRect(0,0,w,h);const mesh=state.preview?.runtime_payload?.mesh;if(!mesh?.positions?.length)return;const p=mesh.positions,idx=mesh.indices??[],c=Math.cos(state.angle),s=Math.sin(state.angle),points=[];for(let i=0;i<p.length;i+=3){const x=p[i],y=p[i+1],z=p[i+2],rx=x*c-z*s,rz=x*s+z*c,scale=145/(2.5+rz*.25);points.push([w/2+rx*scale,h*.58-y*scale,rz])}ctx.lineWidth=1;ctx.strokeStyle='#6dd3ff';ctx.fillStyle='#17466a88';for(let i=0;i<idx.length;i+=3){const a=points[idx[i]],b=points[idx[i+1]],d=points[idx[i+2]];if(!a||!b||!d)continue;ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.lineTo(d[0],d[1]);ctx.closePath();ctx.fill();ctx.stroke()}state.angle+=.008;requestAnimationFrame(drawMesh)}
function renderEvidence(){const p=state.preview,i=state.inspection,a=i?.accepted;$('previewRoot').textContent=`Preview Root ${short(p?.preview_root)}`;const values=[['候选',p?.variant],['三角形',p?.visual?.triangle_count],['PBR贴图',p?.visual?.pbr_files?.length],['骨架身体',p?.physical?.shape],['Workspace',i?.production?.workspace_root],['Candidate',p?.candidate_root],['Project',i?.project?.project_root],['Acceptance',a?.acceptance_root]];$('metrics').innerHTML=values.slice(0,4).map(([k,v])=>`<div class="metric"><span>${k}</span><b>${v??'—'}</b></div>`).join('');$('evidence').innerHTML=values.slice(4).map(([k,v])=>`<article><small>${k}</small><code>${v??'—'}</code></article>`).join('')}
async function loadPreview(){state.preview=await post('/api/asset-forge/session/preview',{forge_id:state.forge.forge_id,include_runtime:true});renderEvidence()}
$('generate').onclick=async()=>{try{await ensureForge();state.inspection=await post('/api/asset-forge/session/generate',{forge_id:state.forge.forge_id});renderCandidates();await loadPreview();setStatus('三个候选已经生成，可切换查看并接受。')}catch(error){setStatus(error.message)}};
$('regenerate').onclick=async()=>{try{await ensureForge();state.inspection=await post('/api/asset-forge/session/regenerate',{forge_id:state.forge.forge_id,patch:{constraints:{palette:$('palette').value.split(',').map(x=>x.trim())}},label:'visual-palette-regeneration'});renderCandidates();await loadPreview();setStatus('已按当前配色定点再生，资产身份保持不变。')}catch(error){setStatus(error.message)}};
$('accept').onclick=async()=>{try{await ensureForge();state.inspection=await post('/api/asset-forge/session/accept',{forge_id:state.forge.forge_id,x:220,y:144,z:0});renderCandidates();renderEvidence();setStatus({status:'accepted',asset_id:state.inspection.accepted.asset_id,node_id:state.inspection.accepted.node_id,spatial_body_id:state.inspection.accepted.spatial_body_id,project_root:state.inspection.project.project_root})}catch(error){setStatus(error.message)}};
boot();drawMesh();
</script></body></html>
