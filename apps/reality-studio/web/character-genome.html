<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; connect-src 'self' http://127.0.0.1:*" />
  <title>Reality Studio · Character Genome Forge</title>
  <style>
    :root{color-scheme:dark;--bg:#0e1216;--panel:#151b20;--panel2:#1b2329;--line:#34414a;--line2:#27323a;--text:#e8edf0;--muted:#93a2aa;--accent:#63bdd0;--green:#79c994;--amber:#d7ad61;--red:#dc7777;--silver:#b7c5ce}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,"Microsoft YaHei",sans-serif}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:#202a31;min-height:32px;padding:5px 9px;cursor:pointer;border-radius:3px}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:wait}.primary{background:#245866;border-color:#559bae}.danger{color:#efb2b2}.top{height:56px;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:#12181c}.brand{min-width:270px}.brand strong{display:block;font-size:15px}.brand small,.muted{color:var(--muted)}.tools{display:flex;gap:5px;align-items:center;margin-left:auto}.icon{width:34px;padding:0;font-size:17px}.session{max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}.layout{height:calc(100vh - 56px);display:grid;grid-template-columns:292px minmax(460px,1fr) 326px}.left,.right{min-width:0;background:var(--panel);overflow:auto}.left{border-right:1px solid var(--line);display:grid;grid-template-columns:94px 1fr}.right{border-left:1px solid var(--line)}.categories{border-right:1px solid var(--line2);padding:8px 0;background:#11171b}.categories button{display:block;width:100%;border:0;border-left:3px solid transparent;background:transparent;text-align:left;padding:8px 9px;color:var(--muted);border-radius:0}.categories button.active{background:#1c262d;border-left-color:var(--accent);color:var(--text)}.controls{padding:12px;min-width:0}.controls h2{font-size:13px;margin:0 0 12px}.control{padding:8px 0;border-bottom:1px solid var(--line2)}.control-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}.control-head label{font-size:11px;color:var(--silver);overflow:hidden;text-overflow:ellipsis}.lock{width:28px;min-height:26px;padding:0}.lock.active{color:var(--amber);border-color:var(--amber)}.range-row{display:grid;grid-template-columns:1fr 58px;gap:6px}.range-row input[type=number],select,input[type=text]{width:100%;border:1px solid var(--line);background:#0f1519;padding:6px;border-radius:2px}.range-row input[type=range]{width:100%;accent-color:var(--accent)}.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.swatch{height:34px;padding:0;border:2px solid transparent}.swatch.active{border-color:#fff}.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2)}input[type=checkbox]{accent-color:var(--accent)}.center{min-width:0;display:flex;flex-direction:column;background:#0b1013}.viewbar{height:46px;display:flex;align-items:center;gap:4px;padding:7px 10px;border-bottom:1px solid var(--line);overflow-x:auto;background:#11171b}.viewbar button{white-space:nowrap}.viewbar button.active{border-color:var(--accent);color:var(--accent)}.viewport{position:relative;flex:1;min-height:0;background:#dfe6e9;display:flex;align-items:center;justify-content:center;overflow:hidden}.viewport canvas{width:100%;height:100%;display:block}.viewport img{max-width:100%;max-height:100%;object-fit:contain}.viewport .badge{position:absolute;left:12px;top:12px;background:#11191fd9;color:#dfe8ec;border:1px solid #40515c;padding:6px 9px;border-radius:3px}.viewport .loading{color:#26333a}.bottom{height:118px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;background:#11171b}.bottom section{padding:10px 12px;overflow:auto;border-right:1px solid var(--line2)}.bottom section:last-child{border-right:0}.bottom h3,.section h3{font-size:11px;color:var(--muted);text-transform:uppercase;margin:0 0 7px;font-weight:600}.status-line{display:flex;gap:12px;align-items:center}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.good{background:var(--green)}.dot.warn{background:var(--amber)}.dot.bad{background:var(--red)}.section{padding:12px 14px;border-bottom:1px solid var(--line2)}.property{display:grid;grid-template-columns:112px minmax(0,1fr);gap:8px;padding:5px 0;border-bottom:1px solid #222c32}.property span{color:var(--muted)}.property code{font:11px/1.4 Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.good{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}.impact-list{margin:0;padding:0;list-style:none}.impact-list li{padding:4px 0;color:var(--silver);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seed{display:grid;grid-template-columns:1fr 34px;gap:6px}.log{margin:0;color:#b8c7cf;white-space:pre-wrap;word-break:break-word;font:11px/1.45 Consolas,monospace}
    @media(max-width:1100px){html,body{overflow:auto}.top{height:auto;min-height:56px;flex-wrap:wrap;padding:8px 12px}.tools{margin-left:0;flex-wrap:wrap}.session{max-width:180px}.layout{height:auto;min-height:calc(100vh - 56px);grid-template-columns:270px minmax(440px,1fr)}.left,.center{height:calc(100vh - 56px)}.right{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-left:0;border-top:1px solid var(--line)}.bottom{height:105px}}@media(max-width:760px){.top{padding:9px}.brand{min-width:0}.session{max-width:100%}.layout{display:block;height:auto}.left{height:560px}.center{height:680px}.right{display:block;width:auto}.viewport{min-height:420px}.property{grid-template-columns:96px minmax(0,1fr)}}
  </style>
</head>
<body>
  <header class="top"><div class="brand"><strong>RNCS Character Genome Forge v0.1</strong><small>RCL · Character Genome · RAGF · VSR · RSR</small></div><div class="session" id="session">创建会话中</div><div class="tools"><button class="icon" id="undo" title="撤销">↶</button><button class="icon" id="redo" title="重做">↷</button><button id="random">随机候选</button><button id="snapshot">Snapshot</button><button id="compare">Compare</button><button class="primary" id="commit">Commit</button><button class="danger" id="abort">Abort</button><button id="export">Export</button><button id="sendAnime">Send to Anime Forge</button></div></header>
  <main class="layout">
    <aside class="left"><nav class="categories" id="categories"></nav><section class="controls"><h2 id="controlTitle">Topology Family</h2><div id="controlBody"></div></section></aside>
    <section class="center"><nav class="viewbar" id="views"><button data-view="front" class="active">正面</button><button data-view="side">侧面</button><button data-view="back">背面</button><button data-view="closeup">近景脸部</button><button data-view="anime">Anime Render</button><button data-view="native_2d">Native 2D</button><button data-view="two_five_d">2.5D</button><button data-view="assisted">3D-Assisted 2D</button><button data-view="turntable">Turntable</button></nav><div class="viewport" id="viewport"><canvas id="mesh"></canvas><img id="media" hidden alt="Character projection"/><span class="badge" id="viewBadge">Generated GLB mesh · LOD0</span><span class="loading" id="loading">正在编译蓝天临角色基因</span></div><div class="bottom"><section><h3>Build State</h3><div class="status-line"><i class="dot" id="statusDot"></i><strong id="statusText">等待 Provider</strong><span class="muted" id="timing"></span></div><pre class="log" id="statusLog"></pre></section><section><h3>Dependency Impact</h3><pre class="log" id="impactLog">尚未编辑</pre></section></div></section>
    <aside class="right"><section class="section"><h3>Identity Authority</h3><div id="identity"></div></section><section class="section"><h3>Validation</h3><div id="validation"></div></section><section class="section"><h3>Lineage & Evidence</h3><div id="evidence"></div></section><section class="section"><h3>Authoring</h3><div class="seed"><input id="seed" type="text" readonly/><button id="copySeed" title="复制 Seed">⧉</button></div><div class="toggle-row"><span>参数对称</span><input id="symmetry" type="checkbox" checked/></div><div class="action-grid"><button id="rollback">Rollback</button><button id="refresh">刷新</button></div></section></aside>
  </main>
  <script>
    const categories=['Topology Family','Body','Face','Eyes','Brows','Nose','Mouth','Jaw','Ears','Hair','Costume','Accessory','Palette','Style','Expression','Voice','Motion'];
    const state={sessionId:null,data:null,catalog:null,category:'Topology Family',view:'front',angle:0,turning:false,snapshotId:'studio-baseline',busy:false};
    const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    async function api(url,payload){const response=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload??{})}),value=await response.json();if(!response.ok||value.error)throw Object.assign(new Error(value.error?.message||`HTTP ${response.status}`),{code:value.error?.code});return value}
    function setBusy(value,label=''){state.busy=value;document.querySelectorAll('button,input,select').forEach(node=>{if(node.id!=='copySeed')node.disabled=value});$('loading').hidden=!value;$('loading').textContent=label||'正在编译受影响资产';$('statusDot').className=`dot ${value?'warn':'good'}`}
    function property(label,value,kind=''){return `<div class="property"><span>${esc(label)}</span><code class="${kind}" title="${esc(value)}">${esc(value)}</code></div>`}
    function parameterControl(id,entry){const label=id.split('.').at(-1).replaceAll('_',' '),locked=entry.locked;return `<div class="control"><div class="control-head"><label>${esc(label)}</label><button class="lock ${locked?'active':''}" data-lock="${esc(id)}" title="${locked?'解锁':'锁定'}">${locked?'●':'○'}</button></div><div class="range-row"><input data-param="${esc(id)}" type="range" min="${entry.min}" max="${entry.max}" step="0.001" value="${entry.value}" ${locked?'disabled':''}/><input data-number="${esc(id)}" type="number" min="${entry.min}" max="${entry.max}" step="0.001" value="${entry.value}" ${locked?'disabled':''}/></div></div>`}
    function selectControl(label,path,options,value){return `<div class="control"><div class="control-head"><label>${esc(label)}</label></div><select data-select="${esc(path)}">${options.map(item=>`<option value="${esc(item)}" ${item===value?'selected':''}>${esc(item)}</option>`).join('')}</select></div>`}
    function renderControls(){if(!state.data||!state.catalog)return;const p=state.data.parameters,c=state.catalog;let html='';const face=region=>Object.entries(p).filter(([id])=>id.startsWith('face.')&&(region?region.some(term=>id.includes(term)):true)).map(([id,value])=>parameterControl(id,value)).join('');
      if(state.category==='Topology Family')html=selectControl('Topology Family','topology_family',Object.keys(c.topologies).filter(id=>c.topologies[id].status==='implemented'),state.data.topology_family);
      else if(state.category==='Body')html=Object.entries(p).filter(([id])=>id.startsWith('body.')).map(([id,value])=>parameterControl(id,value)).join('');
      else if(state.category==='Face')html=face(['face_width','face_length','forehead','temple','cheek']);
      else if(state.category==='Eyes')html=face(['eye_']);else if(state.category==='Brows')html=face(['brow_']);else if(state.category==='Nose')html=face(['nose_']);else if(state.category==='Mouth')html=face(['mouth_','lip_','philtrum']);else if(state.category==='Jaw')html=face(['jaw_','chin_']);else if(state.category==='Ears')html=face(['ear_']);
      else if(state.category==='Hair')html=selectControl('Hair Family','appearance_loadout.hair_family',c.hair.map(item=>item.id),state.data.appearance.hair_family)+`<div class="control"><div class="control-head"><label>Hair Color</label></div><input data-color="appearance_loadout.hair_color" type="color" value="${state.data.appearance.hair_color}"/></div>`;
      else if(state.category==='Costume')html=selectControl('Costume Family','appearance_loadout.costume_family',c.costumes.map(item=>item.id),state.data.appearance.costume_family);
      else if(state.category==='Accessory')html=selectControl('Accessory','appearance_loadout.accessory',['none','ear-cuff-left','collar-pin'],state.data.appearance.accessory??'none');
      else if(state.category==='Palette')html=`<div class="swatches">${c.palettes.map(item=>`<button class="swatch ${item.id===state.data.appearance.palette_family?'active':''}" data-palette="${esc(item.id)}" style="background:${item.colors.base}" title="${esc(item.id)}"></button>`).join('')}</div>`;
      else if(state.category==='Style')html=property('Profile','anime-npr-clean-v0.1')+property('Line','stable-ink-v0.1')+property('Passes','color / line / shadow / depth / normal / motion');
      else if(state.category==='Expression')html=selectControl('Expression','state_overlays.expression',['neutral','calm','puzzled','restrained_smile','focused','angry','sad','surprised'],state.data.state_overlays?.expression??'neutral');
      else if(state.category==='Voice')html=property('Authority','Voice Forge')+property('Profile','mandarin-anime-v1')+property('Visemes',state.data.counts.visemes);
      else if(state.category==='Motion')html=property('Authority','RSR / Director')+property('Hair','profile-bound')+property('Costume','profile-bound');
      $('controlTitle').textContent=state.category;$('controlBody').innerHTML=html;bindControls();}
    function bindControls(){document.querySelectorAll('[data-param]').forEach(input=>{input.oninput=()=>{const number=document.querySelector(`[data-number="${input.dataset.param}"]`);if(number)number.value=input.value};input.onchange=()=>patch(input.dataset.param,Number(input.value))});document.querySelectorAll('[data-number]').forEach(input=>{input.onchange=()=>patch(input.dataset.number,Number(input.value))});document.querySelectorAll('[data-select]').forEach(select=>{select.onchange=()=>patch(select.dataset.select,select.value==='none'?null:select.value)});document.querySelectorAll('[data-color]').forEach(input=>{input.onchange=()=>patch(input.dataset.color,input.value)});document.querySelectorAll('[data-lock]').forEach(button=>{button.onclick=()=>command('lock',{parameter:button.dataset.lock,locked:!button.classList.contains('active')})});document.querySelectorAll('[data-palette]').forEach(button=>{button.onclick=()=>patch('appearance_loadout.palette_family',button.dataset.palette)})}
    function update(data){state.data=data;$('session').textContent=`${data.character_id} · ${data.quality.tier}`;$('seed').value=data.lineage?.seed??'';$('symmetry').checked=data.symmetry;$('undo').disabled=data.history.undo===0;$('redo').disabled=data.history.redo===0;$('identity').innerHTML=property('Character ID',data.character_id)+property('Genome ID',data.genome_id)+property('Identity Signature',data.identity_signature_root)+property('Continuity',`${data.continuity.status} · ${data.continuity.score}`,data.continuity.status==='pass'?'good':'bad')+property('Topology',data.topology_family);$('validation').innerHTML=property('Provider',data.provider.provider_id)+property('Quality Tier',data.quality.tier)+property('Validation',data.quality.valid?'PASS':'FAIL',data.quality.valid?'good':'bad')+property('License',data.license)+property('LOD',3)+property('Morph / Expr / Viseme',`${data.counts.identity_morphs} / ${data.counts.expressions} / ${data.counts.visemes}`);$('evidence').innerHTML=property('Genome Root',data.genome_root)+property('Asset Root',data.asset_root)+property('Family Root',data.family_root)+property('Evidence',data.evidence.ledger_root)+property('Lineage',data.lineage.lineage_root);$('statusText').textContent=data.quality.valid?'Candidate valid':'Candidate rejected';$('statusDot').className=`dot ${data.quality.valid?'good':'bad'}`;$('statusLog').textContent=`${data.counts.identity_parameters} identity params · ${data.counts.bones} bones · ${data.counts.hair_families} hair · ${data.counts.costume_families} costume`;const impact=data.impact;$('impactLog').textContent=impact?`${impact.scope}\nrebuild: ${(impact.rebuild??[]).join(', ')}\npreserved: ${(impact.rebuild_receipt?.preserved_artifacts??[]).join(', ')}\ncache: ${Math.round((impact.rebuild_receipt?.cache?.hit_rate??0)*100)}%`:'尚未编辑';renderControls();renderView();}
    async function patch(path,value){try{setBusy(true,`正在编译 ${path}`);const data=await api('/api/character-genome/session/command',{session_id:state.sessionId,command:'patch',path,value});update(data)}catch(error){status(error,'bad')}finally{setBusy(false)}}
    async function command(command,extra={}){try{setBusy(true,`正在执行 ${command}`);const data=await api('/api/character-genome/session/command',{session_id:state.sessionId,command,...extra});if(data.preview_mesh)update(data);else{status(data,'good');await refresh()}return data}catch(error){status(error,'bad')}finally{setBusy(false)}}
    async function refresh(){const data=await api('/api/character-genome/session/inspect',{session_id:state.sessionId});update(data)}
    function status(value,kind='good'){$('statusDot').className=`dot ${kind}`;$('statusText').textContent=value instanceof Error?value.message:(value.status||value.format||'完成');$('statusLog').textContent=value instanceof Error?`${value.code??'ERROR'}: ${value.message}`:JSON.stringify(value,null,2)}
    function renderView(){if(!state.data)return;const imageViews={anime:'anime',native_2d:'native_2d',two_five_d:'two_five_d',assisted:'assisted'};if(imageViews[state.view]){$('mesh').hidden=true;$('media').hidden=false;$('media').src=state.data.preview_assets[imageViews[state.view]];$('viewBadge').textContent=state.view.replaceAll('_',' ');state.turning=false;return}$('media').hidden=true;$('mesh').hidden=false;state.turning=state.view==='turntable';state.angle=state.view==='front'||state.view==='closeup'?0:state.view==='side'?Math.PI/2:state.view==='back'?Math.PI:state.angle;$('viewBadge').textContent=state.view==='turntable'?'Generated mesh · live turntable':`${state.view} · Generated GLB mesh`;drawMesh()}
    function hex(value){const text=String(value||'#888888').replace('#','');return`#${text.padEnd(6,'0').slice(0,6)}`}
    function drawMesh(){const canvas=$('mesh'),rect=canvas.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);canvas.width=Math.max(1,Math.round(rect.width*dpr));canvas.height=Math.max(1,Math.round(rect.height*dpr));const ctx=canvas.getContext('2d'),mesh=state.data?.preview_mesh;if(!mesh)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,rect.width,rect.height);ctx.fillStyle='#dfe6e9';ctx.fillRect(0,0,rect.width,rect.height);const close=state.view==='closeup',scale=Math.min(rect.width/(close?1.0:1.25),rect.height/(close?.46:2.02)),centerY=close?1.62:.91,cos=Math.cos(state.angle),sin=Math.sin(state.angle),points=[];for(let i=0;i<mesh.positions.length;i+=3){const x=mesh.positions[i],y=mesh.positions[i+1],z=mesh.positions[i+2],rx=x*cos-z*sin,rz=x*sin+z*cos,perspective=1/(1+rz*.16);points.push([rect.width/2+rx*scale*perspective,rect.height/2-(y-centerY)*scale*perspective,rz,mesh.parts[i/3],mesh.regions?.[i/3]??'',y])}const triangles=[];for(let i=0;i<mesh.indices.length;i+=3){const a=points[mesh.indices[i]],b=points[mesh.indices[i+1]],c=points[mesh.indices[i+2]];triangles.push({a,b,c,z:(a[2]+b[2]+c[2])/3,part:a[3],region:a[4],height:(a[5]+b[5]+c[5])/3})}triangles.sort((a,b)=>b.z-a.z);const palette=mesh.palette,colorFor=t=>{if(t.part==='hair')return hex(palette.hair);if(t.part==='costume')return t.region==='emblem'?hex(palette.emblem):t.region.includes('tail')?hex(palette.secondary):hex(palette.base);if(t.part==='face'){if(t.region.startsWith('eye'))return hex(palette.eye);if(t.region.startsWith('brow'))return hex(palette.hair);if(t.region==='mouth')return '#713f4b';return hex(palette.skin)}if(t.region==='hands'||t.region==='neck')return hex(palette.skin);if(t.region==='feet')return hex(palette.base);if(t.region==='limb')return t.height<.72?hex(palette.secondary):hex(palette.base);return hex(palette.secondary)};for(const t of triangles){ctx.beginPath();ctx.moveTo(t.a[0],t.a[1]);ctx.lineTo(t.b[0],t.b[1]);ctx.lineTo(t.c[0],t.c[1]);ctx.closePath();ctx.fillStyle=colorFor(t);ctx.fill();ctx.strokeStyle='#26323a66';ctx.lineWidth=.55;ctx.stroke()}if(state.turning){state.angle=(state.angle+.008)%(Math.PI*2);requestAnimationFrame(drawMesh)}}
    async function init(){try{setBusy(true,'正在编译蓝天临角色基因');const sample=await fetch('/api/character-genome/sample').then(r=>r.json());state.catalog=sample.catalog;const data=await api('/api/character-genome/session/new',{source:sample.source});state.sessionId=data.session_id;update(data);status({status:'Reference Provider candidate ready'},'good')}catch(error){status(error,'bad')}finally{setBusy(false)}}
    $('categories').innerHTML=categories.map((item,index)=>`<button class="${index===0?'active':''}" data-category="${item}">${item}</button>`).join('');document.querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{state.category=button.dataset.category;document.querySelectorAll('[data-category]').forEach(item=>item.classList.toggle('active',item===button));renderControls()});document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{state.view=button.dataset.view;document.querySelectorAll('[data-view]').forEach(item=>item.classList.toggle('active',item===button));renderView()});
    $('undo').onclick=()=>command('undo');$('redo').onclick=()=>command('redo');$('random').onclick=()=>command('random');$('snapshot').onclick=async()=>{state.snapshotId=`studio-${Date.now()}`;await command('snapshot',{id:state.snapshotId})};$('compare').onclick=()=>command('compare',{snapshot_id:state.snapshotId});$('rollback').onclick=()=>command('rollback',{snapshot_id:state.snapshotId});$('abort').onclick=()=>command('abort');$('export').onclick=()=>command('export');$('refresh').onclick=refresh;$('symmetry').onchange=()=>command('symmetry',{enabled:$('symmetry').checked});$('copySeed').onclick=()=>navigator.clipboard?.writeText($('seed').value);$('commit').onclick=()=>{if(confirm('提交当前已验证角色资产到 RNCS Character Library？'))command('commit',{approved:true})};$('sendAnime').onclick=()=>{const id=prompt('Anime Forge Session ID');if(id)api('/api/character-genome/send-to-anime',{session_id:state.sessionId,anime_session_id:id}).then(value=>status(value,'good')).catch(error=>status(error,'bad'))};window.addEventListener('resize',()=>{if(!$('mesh').hidden)drawMesh()});init();
  </script>
</body>
</html>
