<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reality Studio v1.5 资产创生工作台</title><link rel="stylesheet" href="asset-forge.css"></head><body>
<header><div><b>Reality Studio v1.5</b><span>资产创生工作台 · RAGF v0.4</span></div><nav><a href="/">返回统一制造</a><i id="connection">连接中</i></nav></header>
<main><section class="intent panel"><h1>从资产意图到可运行实体</h1><textarea id="description">创建一名冰属性三维女剑士，名字叫霜璃，属于北境守望者。动作敏捷，蓝白战斗服，攻击前有清晰预警。</textarea><div class="row"><label>资产类型<select id="kind"><option value="character-3d">3D角色</option><option value="prop-3d">3D道具</option><option value="environment-3d">3D环境</option></select></label><label>平台<select id="platform"><option value="desktop,mobile,web,xr">全平台</option><option value="mobile,web">手机与Web</option><option value="desktop,xr">桌面与XR</option></select></label></div><label>配色<input id="palette" value="#1c4fa3,#f2f6ff,#9ddcff,#17305a"></label><div class="actions"><button id="generate" class="primary">生成三个候选</button><button id="regenerate">按当前配色定点再生</button><button id="accept" class="accept">接受并放入场景</button></div><pre id="status">准备创建统一制造会话…</pre></section>
<section class="candidates panel"><div class="head"><h2>候选资产</h2><span id="generation">Generation —</span></div><div id="cards" class="cards"><div class="empty">尚未生成</div></div></section>
<section class="preview panel"><div class="head"><h2>真实结构预览</h2><span id="previewRoot">Preview Root —</span></div><canvas id="canvas" width="640" height="420"></canvas><div id="metrics" class="metrics"></div></section>
<section class="evidence panel"><h2>制造证据</h2><div id="evidence"></div></section></main>
<script src="asset-forge.js"></script></body></html>
