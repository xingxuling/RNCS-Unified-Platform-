function initLocal(){const ents={};for(const e of program.entities)ents[e.entity_id]={entity_id:e.entity_id,active:true,alive:true,variables:clone(e.variables),components:clone(e.components)};inspection={format:'offline',session_id:'offline',status:'stopped',validation:{valid:true,errors:[],warnings:[]},program:{identity:program.identity,program_root:program.program_root,tick_rate:program.tick_rate,counts:{entities:program.entities.length,machines:program.state_machines.length,trees:program.behavior_trees.length,rules:program.rules.length,capabilities:program.capabilities.length}},runtime:{tick:0,time:0,state_root:program.program_root.slice(0,64),globals:clone(program.globals),entities:ents,machines:Object.fromEntries(program.state_machines.map(m=>[m.machine_id,{state:m.initial_state,entered_tick:0}])),trees:Object.fromEntries(program.behavior_trees.map(t=>[t.tree_id,{status:'idle'}])),paused:false,proposals:[],diagnostics:[],commands:0,events_processed:0},editor:{history_index:localHistoryIndex,history_length:localHistory.length,can_undo:localHistoryIndex>0,can_redo:localHistoryIndex<localHistory.length-1,breakpoints:[],snapshots:snapshots.map(x=>x.id)},graphs:localGraphs(),trace_tail:[],last_result:null};}
function localGraphs(){return{rules:ruleGraph(),state_machine:machineGraph(),behavior_tree:treeGraph()}}
function machineGraph(){const m=program.state_machines[0];if(!m)return{nodes:[],edges:[]};const cols=2,nodes=m.states.map((s,i)=>({id:s.state_id,label:s.state_id,x:90+(i%cols)*260,y:70+Math.floor(i/cols)*150,initial:s.state_id===m.initial_state,transition_count:(s.transitions||[]).length,on_enter_count:(s.on_enter||[]).length,on_tick_count:(s.on_tick||[]).length})),edges=[];for(const s of m.states)for(const t of s.transitions||[])edges.push({from:s.state_id,to:t.target,priority:t.priority||0});return{machine_id:m.machine_id,nodes,edges}}
function walkTree(n,parent=null,out={nodes:[],edges:[]},d=0){if(!n)return out;const id=n.node_id||`node:${out.nodes.length}`;out.nodes.push({id,label:n.name||n.type||id,type:n.type||'unknown',depth:d});if(parent)out.edges.push({from:parent,to:id});for(const c of n.children||(n.child?[n.child]:[]))walkTree(c,id,out,d+1);return out}
function treeGraph(){const t=program.behavior_trees[0];if(!t)return{nodes:[],edges:[]};const o=walkTree(t.root),levels={};o.nodes.forEach(n=>(levels[n.depth]??=[]).push(n));Object.entries(levels).forEach(([d,a])=>a.forEach((n,i)=>{n.x=90+i*230;n.y=60+Number(d)*130}));return{tree_id:t.tree_id,...o}}
function ruleGraph(){const events=[...new Set(program.rules.map(r=>r.event))],nodes=[],edges=[];events.forEach((e,i)=>nodes.push({id:`event:${e}`,kind:'event',label:e,x:60,y:50+i*95}));program.rules.forEach((r,i)=>{nodes.push({id:r.rule_id,kind:'rule',label:r.rule_id,x:340,y:50+i*95,actions:(r.actions||[]).length});edges.push({from:`event:${r.event}`,to:r.rule_id})});return{nodes,edges}}
function activeInput(){return{move_left:!!(keyState.ArrowLeft||keyState.KeyA),move_right:!!(keyState.ArrowRight||keyState.KeyD),attack:!!(keyState.Space||keyState.KeyJ),restart:!!keyState.KeyR}}
async function createSession(){if(server){inspection=await api('/api/behavior/session/new',{program});sessionId=inspection.session_id}else{initLocal();sessionId='offline'}render()}
function localTrace(type,payload={}){inspection.trace_tail.push({sequence:inspection.trace_tail.length+1,tick:inspection.runtime.tick,time:inspection.runtime.time,type,...payload});inspection.trace_tail=inspection.trace_tail.slice(-200)}
function localStep(input){const r=inspection.runtime,e=r.entities,p=e.player.variables,n=e.enemy.variables,k=e.key.variables,d=e.door.variables;r.tick++;r.time=r.tick/(program.tick_rate||60);const oldPlayer=r.machines['machine:player']?.state||'idle';let next='idle';if(p.health<=0)next='dead';else if(r.globals.victory)next='victory';else if(input.attack&&p.attack_cooldown<=0)next='attacking';else if(input.move_left||input.move_right)next='moving';if(next!==oldPlayer){r.machines['machine:player'].state=next;localTrace('machine.transition',{machine_id:'machine:player',from:oldPlayer,to:next})}if(input.move_left)p.x-=p.speed;if(input.move_right)p.x+=p.speed;p.x=Math.max(24,Math.min(610,p.x));p.attack_cooldown=Math.max(0,(p.attack_cooldown||0)-1);if(!k.collected&&Math.abs(p.x-k.x)<24){k.collected=true;p.has_key=true;r.globals.score+=100;r.globals.message='获得寒霜钥匙';localTrace('rule.fired',{rule_id:'collect-key'})}if(n.health>0){const dx=p.x-n.x;if(Math.abs(dx)>48)n.x+=Math.sign(dx)*n.speed;else{if(input.attack&&p.attack_cooldown<=0){n.health-=25;p.attack_cooldown=18;r.globals.score+=100;localTrace('capability.decision',{capability_id:'experience.effect.emit',decision:'allow'});localTrace('rule.fired',{rule_id:'player-hit-enemy'})}else if(r.tick%50===0){p.health-=8;localTrace('rule.fired',{rule_id:'enemy-hit-player'})}}}if(n.health<=0&&e.enemy.active){e.enemy.active=false;r.globals.enemy_defeated=true;r.globals.score+=250;r.globals.message='守卫已被击败';localTrace('rule.fired',{rule_id:'enemy-defeated'})}if(p.has_key&&r.globals.enemy_defeated){d.open=true;r.globals.door_open=true}if(d.open&&p.x>540){r.globals.victory=true;r.globals.score+=205;r.globals.message='试炼完成';r.machines['machine:player'].state='victory';localTrace('rule.fired',{rule_id:'victory'})}r.events_processed+=2;r.state_root=`offline:${r.tick}:${r.globals.score}:${p.health}:${n.health}`;localTrace('tick.committed',{root:r.state_root,changed_paths:['entity:player.x','globals.score']});drawGame()}
async function step(){try{if(server)inspection=await api('/api/behavior/session/step',{session_id:sessionId,input:activeInput()});else localStep(activeInput());renderRuntimeOnly()}catch(e){toast(e.message)}}
function play(){if(timer)return;$('#playBtn').textContent='● 运行中';timer=setInterval(step,1000/30);toast('行为世界开始运行')}
function pause(){clearInterval(timer);timer=null;$('#playBtn').textContent='▶ 运行';if(server&&sessionId)api('/api/behavior/session/command',{session_id:sessionId,command:'pause'}).then(v=>{inspection=v;renderRuntimeOnly()}).catch(()=>{});toast('已暂停')}
async function command(cmd,extra={}){try{if(server){inspection=await api('/api/behavior/session/command',{session_id:sessionId,command:cmd,...extra})}else if(cmd==='reset')initLocal();else if(cmd==='undo'&&localHistoryIndex>0){program=clone(localHistory[--localHistoryIndex]);initLocal()}else if(cmd==='redo'&&localHistoryIndex<localHistory.length-1){program=clone(localHistory[++localHistoryIndex]);initLocal()}render();toast(cmd)}catch(e){toast(e.message)}}
function metrics(){const c=inspection?.program?.counts||{};const r=inspection?.runtime||{};return[['实体',c.entities||0],['状态机',c.machines||0],['行为树',c.trees||0],['规则',c.rules||0],['Tick',r.tick||0],['事件',r.events_processed||0],['命令',r.commands||0]].map(([k,v])=>`<div class="metric"><small>${k}</small><b>${v}</b></div>`).join('')}
function nav(){const counts={overview:'',rules:program.rules.length,machines:program.state_machines.length,trees:program.behavior_trees.length,entities:program.entities.length,runtime:'LIVE',trace:inspection?.trace_tail?.length||0,json:'{}'};$('#nav').innerHTML=Object.entries(panels).map(([k,v])=>`<button data-panel="${k}" class="${panel===k?'active':''}"><span>${v[0]}</span><span class="badge">${counts[k]}</span></button>`).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{panel=b.dataset.panel;selected=null;render()})}
function overview(){const r=inspection.runtime;return`<div class="cards"><div class="card" data-jump="rules"><strong>事件与规则</strong><p>${program.rules.length}条规则，把输入和世界事件变成状态变化。</p><div class="chips"><span class="chip">Event Bus</span><span class="chip">Authority</span></div></div><div class="card" data-jump="machines"><strong>角色状态机</strong><p>${program.state_machines.length}个状态机，控制待机、移动、攻击、死亡和胜利。</p><div class="chips"><span class="chip">Deterministic</span><span class="chip">Hot Reload</span></div></div><div class="card" data-jump="trees"><strong>Agent行为树</strong><p>${program.behavior_trees.length}棵行为树，让NPC观察、追击和行动。</p><div class="chips"><span class="chip">Selector</span><span class="chip">Sequence</span></div></div><div class="card" data-jump="runtime"><strong>实时运行</strong><p>当前Tick ${r.tick}，状态根 ${esc(String(r.state_root).slice(0,20))}。</p><div class="chips"><span class="chip">Play</span><span class="chip">Pause</span><span class="chip">Step</span></div></div></div><div class="panel" style="margin-top:12px"><div class="panel-head"><strong>Godot成熟度追赶路径</strong><span>行为原生里程碑</span></div><div style="padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:9px"><div class="kv"><span>规则图</span><b>已实现</b></div><div class="kv"><span>状态机</span><b>已实现</b></div><div class="kv"><span>行为树</span><b>已实现</b></div><div class="kv"><span>调试时间线</span><b>已实现</b></div><div class="kv"><span>热更新</span><b>已实现</b></div><div class="kv"><span>Undo/Redo</span><b>已实现</b></div><div class="kv"><span>断点/单步</span><b>已实现</b></div><div class="kv"><span>RFE证据</span><b>已实现</b></div></div></div>`}
function svgGraph(g,type){const by=Object.fromEntries(g.nodes.map(n=>[n.id,n]));const edges=(g.edges||[]).map(e=>{const a=by[e.from],b=by[e.to];if(!a||!b)return'';return`<path class="edge" d="M${a.x+135},${a.y+34} C${a.x+175},${a.y+34} ${b.x-35},${b.y+34} ${b.x},${b.y+34}" marker-end="url(#arrow)"/>`}).join('');const nodes=g.nodes.map(n=>`<g class="node ${n.initial?'initial':''} ${selected?.id===n.id?'selected':''}" data-id="${esc(n.id)}" transform="translate(${n.x},${n.y})"><rect width="135" height="68" rx="10"/><text x="12" y="25">${esc(n.label)}</text><text class="sub" x="12" y="46">${esc(n.kind||n.type||type)}${n.transition_count!==undefined?' · '+n.transition_count+' transitions':''}</text></g>`).join('');return`<div class="panel"><div class="panel-head"><strong>${panels[panel][0]}</strong><span>点击节点编辑；热更新保持运行状态</span></div><div class="graph-wrap"><svg class="graph" viewBox="0 0 980 560"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#4f7797"/></marker></defs>${edges}${nodes}</svg></div></div>`}
function cards(kind,items,idKey){return`<div class="cards">${items.map((x,i)=>`<div class="card ${selected?.index===i?'selected':''}" data-index="${i}" data-kind="${kind}"><strong>${esc(x[idKey]||x.name||`#${i}`)}</strong><p>${esc(x.description||x.event||x.tags?.join(', ')||'现实行为实体')}</p><div class="chips">${Object.keys(x).slice(0,4).map(k=>`<span class="chip">${esc(k)}</span>`).join('')}</div></div>`).join('')}</div>`}
function runtimeView(){return`<div class="game-grid"><div class="game-stage"><canvas id="game" width="640" height="360"></canvas><p style="color:#7890a8;font-size:11px">A/D 或方向键移动，Space/J攻击，R重置。运行模式下由行为织构实时驱动。</p></div><div class="game-side">${watchHtml()}</div></div>`}
function watchHtml(){const r=inspection.runtime,e=r.entities||{},p=e.player?.variables||{},n=e.enemy?.variables||{};return[['玩家状态',r.machines?.['machine:player']?.state],['敌人状态',r.machines?.['machine:enemy']?.state],['玩家生命',p.health],['敌人生命',n.health],['钥匙',p.has_key?'已获得':'未获得'],['出口',r.globals?.door_open?'开启':'关闭'],['分数',r.globals?.score],['胜利',r.globals?.victory?'是':'否']].map(([a,b])=>`<div class="kv"><span>${a}</span><b>${esc(b??'—')}</b></div>`).join('')}
function traceView(){return`<div class="panel"><div class="panel-head"><strong>完整事件轨迹</strong><span>${inspection.trace_tail.length}条可见记录</span></div><div style="padding:12px"><pre style="white-space:pre-wrap;color:#b8cde0">${esc(JSON.stringify(inspection.trace_tail,null,2))}</pre></div></div>`}
function jsonView(){return`<div class="panel"><div class="panel-head"><strong>行为程序 JSON</strong><span>${esc(program.identity.title)}</span></div><div style="padding:12px"><textarea id="programJson" class="json-editor" style="min-height:520px">${esc(JSON.stringify(program,null,2))}</textarea><div class="button-row"><button id="applyProgram" class="primary">校验并热更新</button><button id="formatProgram">格式化</button></div></div></div>`}
function content(){if(panel==='overview')return overview();if(panel==='rules')return svgGraph(inspection.graphs.rules,'rule');if(panel==='machines')return svgGraph(inspection.graphs.state_machine,'state');if(panel==='trees')return svgGraph(inspection.graphs.behavior_tree,'tree');if(panel==='entities')return cards('entities',program.entities,'entity_id');if(panel==='runtime')return runtimeView();if(panel==='trace')return traceView();return jsonView()}
function drawGame(){const c=$('#game');if(!c||!inspection)return;const x=c.getContext('2d'),r=inspection.runtime,e=r.entities;x.fillStyle='#071426';x.fillRect(0,0,640,360);x.fillStyle='#102c46';x.fillRect(0,300,640,60);const door=e.door?.variables||{};x.fillStyle=door.open?'#74f2ce':'#2c526b';x.fillRect((door.x||570)-18,(door.y||230)-70,36,100);const key=e.key?.variables||{};if(!key.collected){x.fillStyle='#ffe47a';x.beginPath();x.arc(key.x||235,key.y||275,9,0,Math.PI*2);x.fill()}const enemy=e.enemy;if(enemy?.active!==false){const n=enemy.variables;x.fillStyle=n.color||'#ff758d';x.fillRect(n.x-14,n.y-30,28,60);x.fillStyle='#fff';x.font='11px sans-serif';x.fillText(`${Math.max(0,n.health)}`,n.x-8,n.y-38)}const p=e.player?.variables||{};x.fillStyle=p.color||'#8cc9ff';x.beginPath();x.ellipse(p.x||70,(p.y||270)-5,14,28,0,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.font='bold 18px sans-serif';x.fillText(r.globals.message||'冰境试炼',18,28);x.fillStyle='#bfe8ff';x.font='14px sans-serif';x.fillText(`生命 ${p.health??100}  分数 ${r.globals.score??0}  钥匙 ${p.has_key?'有':'无'}`,18,55);if(r.globals.victory){x.fillStyle='#08111dcc';x.fillRect(170,120,300,100);x.fillStyle='#74f2ce';x.font='bold 30px sans-serif';x.fillText('试炼完成',255,175)}}
function renderTrace(){const rows=(inspection.trace_tail||[]).slice().reverse();$('#trace').innerHTML=rows.map(t=>`<div class="trace-row"><b>${t.tick}</b><em>${esc(t.type)}</em><span>${esc(JSON.stringify(Object.fromEntries(Object.entries(t).filter(([k])=>!['sequence','tick','time','type'].includes(k)))).slice(0,260))}</span></div>`).join('')||'<div style="padding:14px;color:#7890a8">运行或单步后，规则、状态迁移、能力调用与提交证据会出现在这里。</div>';$('#traceMeta').textContent=`Tick ${inspection.runtime.tick} · ${rows.length} records`}
function selectedObject(){if(!selected)return null;if(selected.kind==='entities')return program.entities[selected.index];const id=selected.id;if(panel==='machines')return program.state_machines[0]?.states.find(x=>x.state_id===id);if(panel==='rules')return program.rules.find(x=>x.rule_id===id)||{node_id:id};if(panel==='trees'){const find=n=>{if(!n)return null;if((n.node_id||'')===id)return n;for(const c of n.children||(n.child?[n.child]:[])){const f=find(c);if(f)return f}return null};return find(program.behavior_trees[0]?.root)||{node_id:id}}return null}
function inspector(){const obj=selectedObject();if(obj){$('#inspectTitle').textContent=obj.entity_id||obj.state_id||obj.rule_id||obj.node_id||selected.id;$('#inspectSub').textContent='编辑后将生成新的Program Root并热更新';$('#inspector').innerHTML=`<textarea id="itemJson" class="json-editor">${esc(JSON.stringify(obj,null,2))}</textarea><div class="button-row"><button id="applyItem" class="primary">应用并热更新</button><button id="breakBtn">添加断点</button></div>${watchBlock()}`;$('#applyItem').onclick=applySelected;$('#breakBtn').onclick=()=>toggleBreakpoint('machine.transition')}else{$('#inspectTitle').textContent='实时检查器';$('#inspectSub').textContent=`${inspection.validation.valid?'结构有效':'存在错误'} · ${server?'原生运行':'离线预览'}`;$('#inspector').innerHTML=`<div class="kv"><span>Program Root</span><b>${esc(program.program_root.slice(0,16))}</b></div><div class="kv"><span>State Root</span><b>${esc(String(inspection.runtime.state_root).slice(0,16))}</b></div><div class="kv"><span>运行状态</span><b>${esc(inspection.status)}</b></div><div class="kv"><span>历史</span><b>${inspection.editor.history_index+1}/${inspection.editor.history_length}</b></div>${watchBlock()}`}}
function watchBlock(){return`<div class="watch"><div><span>globals.score</span><b>${inspection.runtime.globals?.score??0}</b></div><div><span>player.health</span><b>${inspection.runtime.entities?.player?.variables?.health??'—'}</b></div><div><span>enemy.health</span><b>${inspection.runtime.entities?.enemy?.variables?.health??'—'}</b></div><div><span>machine:player</span><b>${inspection.runtime.machines?.['machine:player']?.state??'—'}</b></div></div>`}
async function replaceProgram(next){program=next;if(server){inspection=await api('/api/behavior/session/command',{session_id:sessionId,command:'hot-reload',program,preserve_state:true});program.program_root=inspection.program.program_root}else{if(!program.program_root)program.program_root=`offline:${Date.now().toString(36)}`;localHistory=localHistory.slice(0,localHistoryIndex+1);localHistory.push(clone(program));localHistoryIndex++;const old=inspection;initLocal();inspection.runtime=old.runtime;inspection.trace_tail=old.trace_tail;inspection.editor.history_index=localHistoryIndex;inspection.editor.history_length=localHistory.length}render();toast('热更新完成')}
async function applySelected(){try{const nextObj=JSON.parse($('#itemJson').value),next=clone(program);if(selected.kind==='entities')next.entities[selected.index]=nextObj;else if(panel==='machines'){const i=next.state_machines[0].states.findIndex(x=>x.state_id===selected.id);next.state_machines[0].states[i]=nextObj}else if(panel==='rules'){const i=next.rules.findIndex(x=>x.rule_id===selected.id);if(i>=0)next.rules[i]=nextObj}else toast('行为树节点请在程序源码中修改');delete next.program_root;await replaceProgram(next)}catch(e){toast('JSON错误：'+e.message)}}
async function applyJson(){try{const next=JSON.parse($('#programJson').value);delete next.program_root;await replaceProgram(next)}catch(e){toast('应用失败：'+e.message)}}
async function toggleBreakpoint(type){try{const has=inspection.editor.breakpoints.includes(type);if(server)inspection=await api('/api/behavior/session/command',{session_id:sessionId,command:has?'breakpoint-remove':'breakpoint-add',type});else{inspection.editor.breakpoints=has?inspection.editor.breakpoints.filter(x=>x!==type):[...inspection.editor.breakpoints,type]}render();toast(has?'断点已移除':'断点已添加')}catch(e){toast(e.message)}}
async function addItem(){const next=clone(program),id=Date.now().toString(36);if(panel==='rules')next.rules.push({rule_id:`rule:${id}`,event:'tick',priority:0,condition:{eq:[1,1]},actions:[{type:'trace',name:`rule.${id}`} ]});else if(panel==='machines')next.state_machines[0].states.push({state_id:`state_${id}`,on_enter:[{type:'trace',name:`state.${id}`}],transitions:[]});else if(panel==='entities')next.entities.push({entity_id:`entity_${id}`,tags:['new'],variables:{x:100,y:200,health:100},components:{}});else return toast('当前面板不支持新增');delete next.program_root;await replaceProgram(next)}
async function validate(){try{const v=server?await api('/api/behavior/validate',{program}):{valid:true,errors:[],warnings:[]};inspection.validation=v;render();toast(v.valid?'行为程序校验通过':`发现${v.errors.length}项错误`)}catch(e){toast(e.message)}}
async function exportAll(){try{if(server){const a=await api('/api/behavior/session/export',{session_id:sessionId});download(`${program.identity.title}_behavior-runtime.json`,a)}else download(`${program.identity.title}.behavior.json`,program);toast('已导出')}catch(e){toast(e.message)}}
function renderRuntimeOnly(){metricsEl();renderTrace();$('#stateRoot').textContent=String(inspection.runtime.state_root).slice(0,20);$('#footerStatus').textContent=`${server?'Native':'Offline'} · Tick ${inspection.runtime.tick}`;if(panel==='runtime')drawGame();inspector()}
function metricsEl(){$('#metrics').innerHTML=metrics()}
function render(){nav();metricsEl();$('#viewTitle').textContent=panels[panel][0];$('#viewDesc').textContent=panels[panel][1];$('#programRoot').textContent=program.program_root;$('#content').innerHTML=content();$('#addBtn').style.display=['rules','machines','entities'].includes(panel)?'':'none';$('#content').querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>{panel=x.dataset.jump;render()});$('#content').querySelectorAll('[data-index]').forEach(x=>x.onclick=()=>{selected={kind:x.dataset.kind,index:Number(x.dataset.index)};render()});$('#content').querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>{selected={id:x.dataset.id};render()});if(panel==='json'){$('#applyProgram').onclick=applyJson;$('#formatProgram').onclick=()=>{$('#programJson').value=JSON.stringify(JSON.parse($('#programJson').value),null,2)}}renderTrace();inspector();drawGame();$('#stateRoot').textContent=String(inspection.runtime.state_root).slice(0,20);$('#footerStatus').textContent=`${server?'Native':'Offline'} · ${inspection.validation.valid?'Valid':'Invalid'} · Tick ${inspection.runtime.tick}`;$('#undoBtn').disabled=!inspection.editor.can_undo;$('#redoBtn').disabled=!inspection.editor.can_redo}
async function detect(){try{const h=await api('/api/health');server=true;$('#serverDot').className='dot ok';$('#serverText').textContent=`原生服务 · ${h.runtimes.length}运行时`;program=await api('/api/behavior/sample')}catch{server=false;$('#serverDot').className='dot warn';$('#serverText').textContent='离线行为编辑';program=clone(window.SAMPLE_BEHAVIOR)}await createSession()}
$('#playBtn').onclick=play;$('#pauseBtn').onclick=pause;$('#stepBtn').onclick=step;$('#resetBtn').onclick=()=>command('reset');$('#undoBtn').onclick=()=>command('undo');$('#redoBtn').onclick=()=>command('redo');$('#validateBtn').onclick=validate;$('#exportBtn').onclick=exportAll;$('#saveBtn').onclick=()=>download(`${program.identity.title}.behavior.json`,program);$('#newBtn').onclick=()=>{program=clone(window.SAMPLE_BEHAVIOR);program.identity.title='新行为世界';createSession()};$('#openBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{try{program=JSON.parse(await e.target.files[0].text());await createSession();toast('行为程序已打开')}catch(x){toast(x.message)}e.target.value=''};$('#hotReloadBtn').onclick=()=>{panel='json';render();toast('编辑JSON后点击“校验并热更新”')};$('#snapshotBtn').onclick=async()=>{if(server){const x=await api('/api/behavior/session/command',{session_id:sessionId,command:'snapshot',label:'manual'});inspection=x.session;snapshots.push({id:x.id});render();toast('快照已创建')}else{snapshots.push({id:`offline:${inspection.runtime.tick}`,state:clone(inspection.runtime),trace:clone(inspection.trace_tail)});inspection.editor.snapshots=snapshots.map(x=>x.id);render();toast('离线快照已创建')}};$('#restoreBtn').onclick=async()=>{const s=snapshots.at(-1);if(!s)return toast('暂无快照');if(server)inspection=await api('/api/behavior/session/command',{session_id:sessionId,command:'restore',snapshot_id:s.id});else{inspection.runtime=clone(s.state);inspection.trace_tail=clone(s.trace)}render();toast('已恢复快照')};$('#addBtn').onclick=addItem;$('#clearTraceBtn').onclick=()=>{$('#trace').innerHTML='';traceVisible=false};
window.addEventListener('keydown',e=>{keyState[e.code]=true;if(['ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();if(e.code==='KeyR')command('reset')});window.addEventListener('keyup',e=>keyState[e.code]=false);window.addEventListener('beforeunload',pause);
detect().catch(e=>{document.body.innerHTML=`<pre style="padding:30px;color:#fecaca">Reality Studio v0.8 启动失败\n${esc(e.stack||e.message)}</pre>`});
})();
</script></body></html>
