[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="aaf-runtime"
version="0.1.0"
description="RNCS Agent Authority Fabric reference runtime"
requires-python=">=3.10"
[project.scripts]
aaf="aaf_runtime.cli:main"
[tool.setuptools]
package-dir={""="python"}
[tool.setuptools.packages.find]
where=["python"]
