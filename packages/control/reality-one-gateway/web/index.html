<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reality One Gateway v0.3</title><style>body{font-family:system-ui,sans-serif;background:#0c1018;color:#e8eef9;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}h1{font-size:30px}.sub{color:#9fb0c8}.bar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button{background:#1f6feb;color:#fff;border:0;border-radius:9px;padding:10px 16px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:#151c28;border:1px solid #263247;border-radius:12px;padding:15px}.ok{color:#62d394}.bad{color:#ff7878}pre{white-space:pre-wrap;background:#080b11;border-radius:10px;padding:14px;max-height:520px;overflow:auto}.tag{font-size:12px;color:#9fb0c8}</style></head><body><div class="wrap"><h1>Reality One Gateway v0.3</h1><div class="sub">动态发现、版本协商、权威编排与独立运行时入口</div><div class="bar"><button onclick="loadRuntimes()">发现运行时</button><button onclick="health()">运行健康检查</button><button onclick="demo()">执行完整演示</button></div><div id="cards" class="grid"></div><h2>执行结果</h2><pre id="out">等待操作</pre></div><script>const out=document.querySelector('#out'),cards=document.querySelector('#cards');async function get(u,o){const r=await fetch(u,o);const j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);return j}async function loadRuntimes(){const j=await get('/api/runtimes');cards.innerHTML=j.runtimes.map(x=>`<div class=card><b>${x.display_name}</b><div class=tag>${x.runtime_id} · ${x.runtime_version}</div><p>${x.transport.kind}</p><div>${x.actions.join(' · ')}</div></div>`).join('');out.textContent=JSON.stringify(j,null,2)}async function health(){const j=await get('/api/health');cards.innerHTML=j.runtimes.map(x=>`<div class=card><b>${x.runtime_id}</b><p class=${x.status==='healthy'?'ok':'bad'}>${x.status}</p><div class=tag>${x.duration_ms} ms</div></div>`).join('');out.textContent=JSON.stringify(j,null,2)}async function demo(){out.textContent='执行中…';const j=await get('/api/demo',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});out.textContent=JSON.stringify({status:j.status,pipeline_root:j.pipeline_root,generation:j.application_result?.rfe?.generation?.realityRevision,envelope_phase:j.application_result?.envelope?.phase,authority:j.authority?.status,runtimes:j.runtime_versions},null,2)}loadRuntimes().catch(e=>out.textContent=e.message);</script></body></html>
