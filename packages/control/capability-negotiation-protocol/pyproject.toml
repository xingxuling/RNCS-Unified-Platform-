[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnp-runtime"
version = "0.1.0"
description = "Python reference validator and negotiator for Capability Negotiation Protocol"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[project.scripts]
cnp-py = "cnp_runtime.cli:main"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
