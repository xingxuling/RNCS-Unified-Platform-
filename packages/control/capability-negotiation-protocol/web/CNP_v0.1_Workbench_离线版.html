<style>
:root{--bg:#07111f;--panel:#0c1a2c;--panel2:#10243a;--text:#e8f2ff;--muted:#91a9c4;--line:#1f3c59;--ok:#59e3ad;--bad:#ff8496;--accent:#66aaff;--warn:#ffd36a}

 $('metrics').innerHTML=`<div class="card metric"><span class="muted">状态</span><b class="${p.status==='satisfied'?'ok':'bad'}">${esc(p.status)}</b></div><div class="card metric"><span class="muted">已选步骤</span><b>${selected}</b></div><div class="card metric"><span class="muted">被拒候选</span><b>${rejected}</b></div><div class="card metric"><span class="muted">总CPU预算</span><b>${p.total_cost?.cpu_millis??0} ms</b></div>`;
 $('plan').innerHTML=(p.steps||[]).map(s=>`<div class="step"><b>${esc(s.step_id)}</b><div><code>${esc(s.capability_id)}@${esc(s.capability_version)}</code><div class="muted">${esc(s.provider_id)}</div></div><div>${esc(s.execution_phase)}</div><div class="${s.reversible?'ok':'warn'}">${s.reversible?'可逆':'不可逆'}</div></div>`).join('')||'<p class="bad">没有满足全部目标的计划。</p>';
 $('offers').innerHTML=Object.entries(x.offers||{}).map(([g,os])=>`<div class="goal"><h3>${esc(g)}</h3>${os.map(o=>`<div class="offer"><div><code>${esc(o.capability_id)}</code><div class="muted">${esc(o.provider_id)}</div></div><div>${esc(o.capability_version)} / ${esc(o.protocol_version??'无共同协议')}</div><b class="${o.eligible?'ok':'bad'}">${o.eligible?'可用':'拒绝'}</b><div>${o.eligible?`评分 ${o.score}`:(o.rejection_reasons||[]).map(r=>`<span class="bad">${esc(r)}</span>`).join('<br>')}</div></div>`).join('')}</div>`).join('');
 $('raw').textContent=JSON.stringify(x,null,2);$('status').textContent=`Negotiation Root: ${x.negotiation_root??'未密封'}`;
}
$('file').onchange=async e=>{try{render(JSON.parse(await e.target.files[0].text()))}catch(err){$('status').textContent='读取失败：'+err.message}};$('sample').onclick=()=>render(SAMPLE);render(SAMPLE);
</script></body></html>
