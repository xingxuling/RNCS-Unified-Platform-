<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RFE Core SDK 工作台</title><style>body{font-family:system-ui;background:#081018;color:#dcecff;margin:0}header{padding:28px;background:linear-gradient(120deg,#102b46,#18233b)}main{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#111b27;border:1px solid #29445f;border-radius:14px;padding:18px}textarea{width:100%;height:320px;background:#07111b;color:#bde3ff;border:1px solid #31536f;border-radius:8px;padding:10px;box-sizing:border-box}button{padding:10px 16px;border:0;border-radius:8px;background:#36a3ff;color:white;font-weight:700}.ok{color:#69e6a6}.bad{color:#ff8080}code{color:#7fd5ff}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><header><h1>RFE Core SDK v0.1</h1><p>Generation与内容对象离线完整性审阅</p></header><main><div class="grid"><section class="card"><h2>粘贴Generation JSON</h2><textarea id="in"></textarea><p><button onclick="verify()">验证结构与完整性根</button></p></section><section class="card"><h2>结果</h2><pre id="out">等待输入</pre></section></div><section class="card"><h2>核心边界</h2><p><code>Revision / Snapshot / Display State</code> 不能宣布现实改变；只有RFE Generation是权威现实代际。</p></section></main><script>const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');function canon(v){if(v===null)return'null';if(v===true)return'true';if(v===false)return'false';if(typeof v==='number')return Object.is(v,-0)?'0':JSON.stringify(v);if(typeof v==='string')return JSON.stringify(v);if(Array.isArray(v))return'['+v.map(canon).join(',')+']';return'{'+Object.keys(v).sort().map(k=>canon(k)+':'+canon(v[k])).join(',')+'}'}async function verify(){let o=document.querySelector('#out');try{let v=JSON.parse(document.querySelector('#in').value),e=v.integrityHash;delete v.integrityHash;let h=hex(await crypto.subtle.digest('SHA-256',enc.encode(canon(v))));o.className=h===e?'ok':'bad';o.textContent=JSON.stringify({valid:h===e,expected:e,actual:h,format:v.format,generationId:v.generationId},null,2)}catch(err){o.className='bad';o.textContent=err.message}}</script></html>
