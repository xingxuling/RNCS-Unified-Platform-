format: reality-kernel.engineering-contract.v0.2
status: executable
target:
  repository: xingxuling/RNCS-Unified-Platform-
  branch: main-95
  package: packages/kernel/reality-kernel
  local_prototype: reality-kernel
must_change:
  - deterministic canonical hashing for reality objects, graph snapshots, transitions, and evidence
  - public reality object ABI with tamper verification
  - deterministic graph relation queries
  - proposal-authority-commit transition execution with atomic failure behavior
  - typed continuity claims with predecessor, epoch, replay, and sequence guards
  - subject-sovereignty envelopes with lease fencing and transition binding
  - continuity ledger acceptance only after a successful kernel/RFE commit
  - evidence compilation bound to transition roots
  - duck-typed RFE local commit bridge without taking ownership of RFE storage
must_not_change:
  - existing RFE, RNCS Contract, LAF, AAF, or RBF semantics
  - distributed consensus, production PKI, network transport, or physical-world claims
  - implicit mutation of a graph when a transition is only executed for preview
interfaces:
  object_abi: src/object-abi.mjs
  graph: src/reality-graph.mjs
  transition_vm: src/transition-vm.mjs
  evidence: src/evidence-compiler.mjs
  rfe_bridge: src/rfe-bridge.mjs
  continuity: src/continuity.mjs
  public_entry: src/index.mjs
vertical_slices:
  - id: RK-01
    name: object-abi
    seam: createRealityObject / verifyRealityObject
    command: npm test -- --test-name-pattern="object ABI"
  - id: RK-02
    name: graph-query
    seam: RealityGraph.query
    command: npm test -- --test-name-pattern="graph query"
  - id: RK-03
    name: transition-vm
    seam: RealityTransitionVM.execute / commit
    command: npm test -- --test-name-pattern="transition"
  - id: RK-04
    name: evidence-and-rfe
    seam: compileEvidence / commitToRfe
    command: npm test -- --test-name-pattern="evidence|RFE"
  - id: RK-07
    name: typed-continuity
    seam: createContinuityClaim / ContinuityLedger.preview / accept
    command: npm test -- --test-name-pattern="continuity"
  - id: RK-08
    name: sovereignty-bound-commit
    seam: RealityTransitionVM with continuity ledger / commitToRfe
    command: npm test -- --test-name-pattern="continuity|RFE"
quality_gates:
  - npm test
  - npm run demo
  - node --check src/index.mjs
  - node --check src/continuity.mjs
boundaries:
  verification: proxy-only local deterministic tests; no external-world verification is claimed
  persistence: RFE remains the authoritative persistence implementation
  authority: approved transition envelope is required before commit
