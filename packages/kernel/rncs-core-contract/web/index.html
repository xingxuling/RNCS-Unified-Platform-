<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RNCS Core Contract Workbench</title><style>body{font-family:system-ui;background:#08111f;color:#e7f0ff;margin:0}.wrap{max-width:1100px;margin:auto;padding:28px}h1{font-size:30px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#101d30;border:1px solid #294262;border-radius:16px;padding:18px}textarea{width:100%;height:390px;background:#07101d;color:#d9e9ff;border:1px solid #365578;border-radius:10px;padding:12px;box-sizing:border-box}button{background:#2b7fff;color:white;border:0;border-radius:9px;padding:10px 16px;font-weight:700}.ok{color:#6ee7a2}.bad{color:#ff8585}code{word-break:break-all}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style><div class="wrap"><h1>RNCS Core Contract v0.1</h1><p>离线审阅 Reality Transition Envelope。浏览器使用 WebCrypto 重新计算 envelope_root。</p><div class="grid"><div class="card"><input id="file" type="file" accept="application/json"><button id="verify">验证</button><textarea id="src" placeholder="粘贴 Envelope JSON"></textarea></div><div class="card"><h2>结果</h2><div id="result">等待输入</div><h3>连续性边界</h3><ul><li>RFE Generation：唯一权威现实代际</li><li>HNAC Snapshot：宿主副本状态</li><li>LAF Revision：语义工件修订</li><li>ICAR Session：执行记录</li><li>VSR/AER：观察者投影</li></ul></div></div></div><script>
const enc=new TextEncoder(),sort=(a,b)=>{const x=enc.encode(a),y=enc.encode(b);for(let i=0;i<Math.min(x.length,y.length);i++)if(x[i]!=y[i])return x[i]-y[i];return x.length-y.length};function c(v){if(v===null)return'null';if(v===true)return'true';if(v===false)return'false';if(typeof v==='number'){if(!Number.isSafeInteger(v))throw Error('浮点数禁止进入核心哈希');return String(v)}if(typeof v==='string')return JSON.stringify(v);if(Array.isArray(v))return'['+v.map(c).join(',')+']';return'{'+Object.keys(v).sort(sort).map(k=>c(k)+':'+c(v[k])).join(',')+'}'}async function hash(v){const b=await crypto.subtle.digest('SHA-256',enc.encode(c(v)));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}file.onchange=async()=>src.value=await file.files[0].text();verify.onclick=async()=>{try{const e=JSON.parse(src.value),x=structuredClone(e);delete x.envelope_root;const h=await hash(x),ok=h===e.envelope_root;result.innerHTML=`<p class="${ok?'ok':'bad'}">${ok?'通过：Envelope 未被篡改':'失败：Envelope Root 不一致'}</p><p>阶段：${e.phase}</p><p>Reality：${e.base_generation?.reality_id}</p><p>Base Generation：${e.base_generation?.generation}</p><p>计算根：<code>${h}</code></p>`}catch(err){result.innerHTML='<p class="bad">'+err.message+'</p>'}}
</script></html>
