[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "hnaf-hnac"
version = "0.8.0"
description = "Reference Host-Neutral Application Capsule toolchain and runtime with portable state, adaptive interface and remote provider, sandbox and RFE receipt fabric"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=46.0.0,<47",
  "jsonschema>=4.20,<5",
  "wasmtime>=39,<40",
  "websockets>=16,<17"
]

[project.scripts]
hnac = "hnac.cli:main"

[tool.setuptools.packages.find]
include = ["hnac*"]

[tool.setuptools.package-data]
hnac = ["schemas/*.json", "templates/**/*", "hosts/**/*"]
