name: anime-forge-phase6-3-geometric-truth

on:
  workflow_dispatch:
  pull_request:
    branches: [main-95]
    paths:
      - "package.json"
      - "packages/world/native-character-morphogenesis-runtime/**"
      - "apps/reality-studio/src/anime-forge-studio.mjs"
      - "apps/reality-studio/src/server.mjs"
      - "apps/reality-studio/web/anime-forge.html"
      - "apps/reality-studio/tests/geometric-truth-workspace.test.mjs"
      - "apps/reality-studio/tests/browser_anime_forge_phase6_3_geometric_truth_test.py"
      - "scripts/*anime-forge-phase6-3*"
      - "docs/architecture/adr/ADR-native-morphology-geometric-representation-v0.1.md"
      - "docs/verification/anime-forge-phase6-3-geometric-truth-v0.1/**"
      - "docs/execution/phase6-3/**"
      - "evidence/anime-forge-phase6-3-geometric-truth-v0.1/**"
      - ".github/workflows/anime-forge-phase6-3-geometric-truth.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install workspace dependencies
        run: npm ci
      - name: Build the native RCL compiler
        run: npm run build:native --workspace @taowind/reality-computation-language
      - name: Build VSR and RSR generated imports
        run: npm run build:world
      - name: Run Phase 6.3 morphology and property tests
        run: npm run test:anime-phase6-3-geometric-truth
      - name: Build deterministic static pack, 5 second episode and MP4
        run: npm run build:anime-phase6-3-geometric-truth
      - name: Verify geometric truth, media and evidence
        run: npm run verify:anime-phase6-3-geometric-truth
      - name: Run Reality Studio API and authority regression
        run: |
          node --test --test-concurrency=1 apps/reality-studio/tests/anime-forge.test.mjs
          node --test --test-concurrency=1 apps/reality-studio/tests/geometric-truth-workspace.test.mjs
          node --test --test-concurrency=1 apps/reality-studio/tests/native-character-surgery.test.mjs
      - name: Install Chromium browser regression dependencies
        run: |
          python -m pip install "playwright>=1.45,<2"
          python -m playwright install --with-deps chromium
      - name: Run Reality Studio desktop and mobile regression
        run: npm run browser:anime-phase6-3-geometric-truth
      - name: Package Phase 6.3 source
        run: npm run package:anime-phase6-3-geometric-truth
      - name: Upload Phase 6.3 evidence and source
        uses: actions/upload-artifact@v4
        with:
          name: rncs-anime-forge-phase6-3-geometric-truth-${{ github.sha }}
          path: |
            evidence/anime-forge-phase6-3-geometric-truth-v0.1
            tmp/RNCS-Anime-Forge-v0.1-phase6-3-geometric-truth-source.zip
            tmp/playwright/anime-forge-phase6-3-geometric-truth
          if-no-files-found: error
