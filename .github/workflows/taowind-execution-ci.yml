name: TaoWind Execution Plane CI

on:
  workflow_dispatch:
    inputs:
      run_android:
        description: Run Android Gradle build when gradlew exists
        required: false
        default: "false"
  pull_request:
    paths:
      - "packages/operations/developer-execution-runtime/**"
      - "packages/integration/taowind-reality-mcp/**"
      - "packages/control/reality-one-gateway/**"
      - "packages/kernel/reality-kernel/**"
      - ".github/workflows/taowind-execution-ci.yml"
      - "package.json"
      - "package-lock.json"
      - "rncs.modules.json"
      - "VERSION-MANIFEST-v0.19.8.json"
      - "CHANGELOG.md"
      - "README.md"
      - "scripts/verify-version-contract.mjs"
      - "scripts/normalize-lockfile-registry.mjs"
  push:
    branches: [main, main-95]
    paths:
      - "packages/operations/developer-execution-runtime/**"
      - "packages/integration/taowind-reality-mcp/**"
      - "packages/control/reality-one-gateway/**"
      - "packages/kernel/reality-kernel/**"
      - "package.json"
      - "package-lock.json"
      - "rncs.modules.json"
      - "VERSION-MANIFEST-v0.19.8.json"
      - "CHANGELOG.md"
      - "README.md"
      - "scripts/verify-version-contract.mjs"
      - "scripts/normalize-lockfile-registry.mjs"

jobs:
  execution-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm for stable monorepo installation
        run: npm install --global npm@11.18.0 --no-audit --no-fund
      - name: Normalize lockfile registry for public runner
        run: node scripts/normalize-lockfile-registry.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify version contract
        run: npm run verify:version-contract
      - run: npm run build --workspace @taowind/reality-simulation-runtime
      - run: npm run build --workspace @taowind/visual-state-runtime
      - run: npm run test:execution
      - run: npm run test:gateway
      - run: npm run test:mcp
      - run: npm run smoke:mcp
      - name: Execute real RSR/VSR evidence
        run: |
          node --input-type=module <<'NODE'
          import {DeveloperExecutionRuntime} from './packages/operations/developer-execution-runtime/src/runtime.mjs';
          const runtime=new DeveloperExecutionRuntime({workspaceRoot:process.cwd(),mode:'founder'});
          await runtime.rsrSimulate({out:'output/ci-rsr'});
          await runtime.vsrRender({out:'output/ci-vsr.png'});
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: taowind-rsr-vsr-evidence
          path: |
            output/ci-rsr
            output/ci-vsr.png

  android-profile:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Build Android project when present
        shell: bash
        run: |
          WRAPPER="$(find . -name gradlew -type f -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "No Gradle wrapper found in this repository. Import or bind an Android project before using android-debug/android-release."
            exit 1
          fi
          chmod +x "$WRAPPER"
          (cd "$(dirname "$WRAPPER")" && ./gradlew assembleDebug)
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "**/build/outputs/apk/**/*.apk"

  windows-native-boundary:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm for stable monorepo installation
        run: npm install --global npm@11.18.0 --no-audit --no-fund
      - name: Normalize lockfile registry for public runner
        run: node scripts/normalize-lockfile-registry.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build --workspace @taowind/reality-simulation-runtime
      - run: npm run build --workspace @taowind/visual-state-runtime
      - name: Verify Windows native boundary
        run: npm run test:native
