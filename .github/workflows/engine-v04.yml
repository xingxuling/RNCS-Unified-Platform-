name: RNCS engine v0.4

on:
  push:
    branches: [main-95]
  pull_request:

jobs:
  engine-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engine/v0.4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/v0.4/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm test
