name: anime-forge-phase6-1-morphogenesis

on:
  workflow_dispatch:
  pull_request:
    branches: [main-95]
    paths:
      - "packages/world/native-character-morphogenesis-runtime/**"
      - "apps/reality-studio/src/native-character-surgery-studio.mjs"
      - "apps/reality-studio/src/server.mjs"
      - "apps/reality-studio/web/anime-forge.html"
      - "apps/reality-studio/tests/native-character-surgery.test.mjs"
      - "scripts/*anime-forge-phase6-1*"
      - "docs/verification/anime-forge-phase6-1-morphogenesis-surgery-v0.1/**"
      - ".github/workflows/anime-forge-phase6-1-morphogenesis.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install workspace dependencies
        run: npm ci
      - name: Build VSR and RSR generated imports
        run: npm run build:world
      - name: Run Phase 6.1 focused tests
        run: npm run test:anime-phase6-1-morphogenesis
      - name: Build deterministic evidence and real MP4
        run: npm run build:anime-phase6-1-morphogenesis
      - name: Verify media, roots and evidence
        run: npm run verify:anime-phase6-1-morphogenesis
      - name: Package source
        run: npm run package:anime-phase6-1-morphogenesis
      - name: Upload Phase 6.1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: rncs-anime-forge-phase6-1-morphogenesis-evidence
          path: |
            evidence/anime-forge-phase6-1-morphogenesis-surgery-v0.1
            tmp/RNCS-Anime-Forge-v0.1-phase6-1-morphogenesis-source.zip
          if-no-files-found: error
