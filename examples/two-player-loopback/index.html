<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reality Network Runtime 双人Loopback</title><style>
:root{color-scheme:dark;font-family:Inter,"Microsoft YaHei",sans-serif;background:#07111f;color:#e7f2ff}*{box-sizing:border-box}body{margin:0;display:grid;grid-template-columns:minmax(520px,1fr) 390px;height:100vh}main{position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#183858,#07111f 62%)}canvas{width:100%;height:100%;display:block}.badge{position:absolute;top:14px;left:14px;padding:8px 12px;border:1px solid #42617f;background:#07111fd9;border-radius:10px}.side{padding:16px;overflow:auto;border-left:1px solid #29435d;background:#0b1726}.panel{border:1px solid #29435d;border-radius:12px;padding:12px;margin-bottom:12px;background:#102137}h1{font-size:18px;margin:0 0 12px}h2{font-size:14px;margin:0 0 8px;color:#9fc8ef}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:12px}.metric{padding:7px;background:#0a1624;border-radius:7px;overflow:hidden}.metric b{display:block;color:#82bfff;font-size:11px}.root{font-family:ui-monospace,monospace;font-size:10px;word-break:break-all}label{display:grid;grid-template-columns:1fr 80px;gap:8px;margin:8px 0;font-size:12px}input{width:100%}button{border:1px solid #4f7598;background:#173554;color:#fff;padding:8px;border-radius:8px;cursor:pointer}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ok{color:#73e5a4}.bad{color:#ff8b8b}.keys{font-size:12px;line-height:1.7;color:#bfd4e8}</style></head><body><main><canvas id="world"></canvas><div class="badge">RSR v0.6 权威世界 · 蓝方 WASD/空格 · 红方方向键/Enter</div></main><aside class="side"><h1>Reality Network Runtime v0.1</h1><div class="panel"><h2>实时网络条件</h2><label>固定延迟 Tick <input id="lat" type="number" min="0" max="20" value="0"></label><label>抖动 Tick <input id="jit" type="number" min="0" max="10" value="0"></label><label>丢包率 % <input id="loss" type="number" min="0" max="90" value="0"></label><div class="buttons"><button onclick="applyConditions()">应用条件</button><button onclick="post('/pause',{})">暂停/继续</button></div></div><div class="panel"><h2>连接控制</h2><div class="buttons"><button onclick="post('/disconnect',{playerId:'blue'})">蓝方断线</button><button onclick="post('/reconnect',{playerId:'blue'})">蓝方重连</button><button onclick="post('/disconnect',{playerId:'red'})">红方断线</button><button onclick="post('/reconnect',{playerId:'red'})">红方重连</button></div></div><div class="panel"><h2>服务器</h2><div id="server" class="grid"></div></div><div class="panel"><h2>蓝方客户端</h2><div id="blue" class="grid"></div></div><div class="panel"><h2>红方客户端</h2><div id="red" class="grid"></div></div><div class="panel keys">推动中央箱子和斜墙发生碰撞。客户端只发送移动/跳跃输入；位置、速度、碰撞和正式State Root由权威RSR服务器产生。</div></aside><script>
const canvas=document.querySelector('#world'),ctx=canvas.getContext('2d');let state=null,keys=new Set(),lastMove={blue:'',red:''};
async function post(url,data){return fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)}).then(r=>r.json())}
function applyConditions(){post('/conditions',{fixedLatencyTicks:+lat.value,jitterTicks:+jit.value,lossRate:+loss.value/100})}
function command(playerId,command){post('/input',{playerId,command}).catch(()=>{})}
const map={KeyW:[0,-1000000],KeyS:[0,1000000],KeyA:[-1000000,0],KeyD:[1000000,0],ArrowUp:[0,-1000000],ArrowDown:[0,1000000],ArrowLeft:[-1000000,0],ArrowRight:[1000000,0]};
addEventListener('keydown',e=>{keys.add(e.code);if(e.code==='Space'){e.preventDefault();command('blue',{type:'jump'})}if(e.code==='Enter')command('red',{type:'jump'});});addEventListener('keyup',e=>keys.delete(e.code));
setInterval(()=>{for(const [player,codes] of [['blue',['KeyW','KeyS','KeyA','KeyD']],['red',['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']]]){let x=0,z=0;for(const c of codes)if(keys.has(c)){x+=map[c][0];z+=map[c][1]}const sig=`${x}:${z}`;if(sig!==lastMove[player]){lastMove[player]=sig;command(player,{type:'move',x,z})}}},50);
function iso(p){const s=Math.min(canvas.width/22,canvas.height/16)/1000;return{x:canvas.width/2+(p.x-p.z)*s*.72,y:canvas.height*.58+(p.x+p.z)*s*.28-p.y*s*.65}}
function box(body){const p=iso(body.position),id=body.id;let w=36,h=25,fill='#6d8194';if(id==='ground'){return}if(id==='player-blue'){fill='#2388ff';w=24;h=42}if(id==='player-red'){fill='#ff414d';w=24;h=42}if(id==='crate'){fill='#c58a46';w=38;h=38}if(id.includes('wall')){fill='#758aa0';w=20;h=80}if(id.includes('obstacle')){fill='#d7b84a';w=100;h=14}ctx.save();ctx.translate(p.x,p.y);ctx.rotate((body.rotation?.y??0)/1000*Math.PI/180*.35);ctx.fillStyle=fill;ctx.strokeStyle='#d7edff';ctx.lineWidth=1.3;ctx.fillRect(-w/2,-h,w,h);ctx.strokeRect(-w/2,-h,w,h);ctx.restore()}
function metric(label,value,cls=''){return `<div class="metric ${cls}"><b>${label}</b>${value??'-'}</div>`}function renderMetrics(el,data,serverRoot){el.innerHTML=metric('客户端Tick',data.clientTick)+metric('未确认输入',data.unacknowledgedInputs)+metric('预测误差',data.predictionError)+metric('回滚次数',data.rollbackCount)+metric('同步状态',data.syncStatus,data.syncStatus==='synchronized'?'ok':'bad')+metric('最后拒绝',data.lastRejection)+`<div class="metric root" style="grid-column:1/3"><b>客户端State Root</b>${data.clientStateRoot}</div>`}
function draw(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio);canvas.width/=devicePixelRatio;canvas.height/=devicePixelRatio;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#244968';for(let i=-10;i<=10;i++){let a=iso({x:i*1000,y:0,z:-9000}),b=iso({x:i*1000,y:0,z:9000});ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();a=iso({x:-12000,y:0,z:i*1000});b=iso({x:12000,y:0,z:i*1000});ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}if(state)state.bodies.filter(b=>b.id!=='ground').sort((a,b)=>(a.position.x+a.position.z)-(b.position.x+b.position.z)).forEach(box);requestAnimationFrame(draw)}
async function poll(){try{state=await fetch('/state',{cache:'no-store'}).then(r=>r.json());const h=state.health;server.innerHTML=metric('服务器Tick',h.server.tick)+metric('传输Tick',h.transport.tick)+metric('丢包',h.transport.dropped)+metric('队列',h.transport.queued)+metric('玩家数',h.server.players)+metric('收据数',h.server.receipts)+`<div class="metric root" style="grid-column:1/3"><b>服务器State Root</b>${h.server.stateRoot}</div>`;renderMetrics(blue,h.clients.blue,h.server.stateRoot);renderMetrics(red,h.clients.red,h.server.stateRoot);}catch{}setTimeout(poll,100)}draw();poll();
</script></body></html>
